<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타자 뒤집기 대전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
/* Layout: arcade cabinet. HUD bar (title, timer, sound) + team score strip on top, proverb-chance banner, 6x5 word-card board as the stage with
   event toasts/ink/missiles layered over it, roster + host controls beside it. Students get the board full width with a personal HUD and a big typing bar. */
:root{
  color-scheme:dark;
  --bg:#0a0c18; --surface:#151935; --surface2:#1d2246; --ink:#f1f3ff; --muted:#9aa2c8; --line:#2b3160; --grid:#ffffff0a;
  --gold:#ffc83d; --gold-deep:#6b4a00; --ok:#3ddc84; --warn:#ffab4a; --blot:#04050b;
  --t0:#e5484d; --t1:#3e7bfa; --t2:#22a75c; --t3:#d4930f; --t4:#8f5de0;
  --t5:#13a3a3; --t6:#d84f97; --t7:#a5713f; --t8:#5a5fd0; --t9:#6f7d96;
  --f-arcade:"Black Han Sans","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-card:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
.t0{--tc:var(--t0)} .t1{--tc:var(--t1)} .t2{--tc:var(--t2)} .t3{--tc:var(--t3)} .t4{--tc:var(--t4)}
.t5{--tc:var(--t5)} .t6{--tc:var(--t6)} .t7{--tc:var(--t7)} .t8{--tc:var(--t8)} .t9{--tc:var(--t9)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* HUD */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-arcade);font-weight:400;font-size:1.7rem;line-height:1.05;margin:0;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--t0),var(--gold),var(--t1));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--muted);font-size:.8rem}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.timer{font-family:var(--f-arcade);font-size:2.6rem;line-height:1;min-width:4ch;text-align:center;font-variant-numeric:tabular-nums;padding:6px 16px;border-radius:10px;background:var(--bg);border:2px solid var(--line)}
.timer.low{color:var(--bg);background:var(--t0);border-color:var(--t0);animation:pulse .5s ease-in-out infinite alternate}
.timer.fever{border-color:var(--gold);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 60%,transparent)}
.hudr{justify-self:end;display:flex;align-items:center;gap:10px}
.phase{color:var(--muted);font-size:.85rem}
.snd{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.8rem}
.snd[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
@keyframes pulse{to{transform:scale(1.06)}}

.scores{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--tc) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 55%,var(--surface))}
.chip .nm{font-family:var(--f-card);font-size:1.05rem;color:color-mix(in srgb,var(--tc) 55%,var(--ink))}
.chip .n{font-family:var(--f-arcade);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip .u{font-size:.75rem;color:var(--muted)}
.chip.lead{box-shadow:0 0 0 2px var(--tc),0 0 16px color-mix(in srgb,var(--tc) 55%,transparent)}
.chip.mine{outline:2px dashed var(--ink);outline-offset:2px}
.chip.hit{animation:shake .4s}

/* proverb chance */
.pv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);border:2px solid var(--gold);
  background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));position:relative;overflow:hidden}
.pv .tag{font-family:var(--f-arcade);font-size:.95rem;color:var(--bg);background:var(--gold);padding:3px 10px;border-radius:6px;white-space:nowrap}
.pv .txt{flex:1;min-width:0;font-family:var(--f-card);font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.2;color:var(--gold);text-wrap:balance}
.pv .sec{font-family:var(--f-arcade);font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--gold)}
.pv .meter{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);transition:width 1s linear}
.pv.typing{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 50%,transparent),0 0 24px color-mix(in srgb,var(--gold) 40%,transparent)}
.pv .done{color:var(--ok)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.boardwrap{position:relative;min-width:0}
.board{--cols:6;--mcols:4;--ch:clamp(50px,7.8vh,76px);--cf:clamp(1.05rem,2vw,1.6rem);display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:box-shadow .3s}
.board.fever{box-shadow:0 0 0 2px var(--gold),0 0 30px color-mix(in srgb,var(--gold) 35%,transparent)}
.card{position:relative;height:var(--ch);border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--tc,var(--line));border-bottom:5px solid color-mix(in srgb,var(--tc,var(--line)) 60%,#000);
  font-family:var(--f-card);font-size:var(--cf);color:#fff;text-shadow:0 2px 0 #0005;padding:0 6px;text-align:center;overflow-wrap:anywhere;
  transition:box-shadow .15s, transform .15s; user-select:none}
.card.n{--tc:var(--surface2);color:var(--muted);text-shadow:none}
.card.hint{box-shadow:0 0 0 4px var(--gold);transform:translateY(-3px)}
.board[data-n="49"]{--cols:7;--mcols:5;--ch:clamp(46px,6.6vh,66px);--cf:clamp(.95rem,1.75vw,1.4rem)}
.board[data-n="64"]{--cols:8;--mcols:6;--ch:clamp(40px,5.6vh,58px);--cf:clamp(.88rem,1.45vw,1.25rem)}
.card.flip{animation:flip .38s ease}
.card.gone{transform:scale(.15) rotate(-8deg);opacity:0;transition:transform .16s ease-in,opacity .16s ease-in;box-shadow:none}
.card.spawn{animation:spawn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes spawn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.card.mine::after{content:"";position:absolute;inset:-4px;border-radius:13px;border:3px solid var(--ok);animation:fade 1s forwards}
.card.boom::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--gold);animation:boom .6s ease-out forwards;pointer-events:none}
.badge{position:absolute;top:-7px;right:-5px;font-family:var(--f-arcade);font-size:.72rem;line-height:1;padding:4px 7px;border-radius:999px;text-shadow:none;
  background:var(--gold);color:var(--bg);box-shadow:0 2px 0 var(--gold-deep);animation:bob 1s ease-in-out infinite alternate}
.badge.i{background:var(--ink);color:var(--blot);box-shadow:0 2px 0 var(--muted)}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes fade{to{opacity:0}}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}

.float{position:absolute;pointer-events:none;font-family:var(--f-arcade);font-size:1.5rem;color:var(--gold);text-shadow:0 2px 0 #000;animation:up .9s ease-out forwards;z-index:6}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
#ink{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;pointer-events:none;opacity:0;z-index:7;touch-action:none}
#ink.on{pointer-events:auto;opacity:1;cursor:grab}
#ink.fade{opacity:0;transition:opacity 2.2s ease-in}
.feed{position:absolute;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8}
.toast{font-family:var(--f-arcade);font-size:clamp(1.2rem,3vw,2.1rem);line-height:1.15;padding:8px 18px;border-radius:12px;text-align:center;max-width:92%;
  background:color-mix(in srgb,var(--tc,var(--gold)) 85%,#000);color:#fff;border:2px solid #fff3;box-shadow:0 8px 24px #0008;animation:pop 2.4s ease forwards}
.toast.gold{--tc:var(--gold);color:var(--bg)}
@keyframes pop{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.missile{position:fixed;left:0;top:0;width:44px;height:18px;pointer-events:none;z-index:60}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;
  background:color-mix(in srgb,var(--bg) 78%,transparent);border-radius:14px;backdrop-filter:blur(2px)}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;text-align:center;max-width:600px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ov h2{font-family:var(--f-arcade);font-weight:400;font-size:2rem;line-height:1.15;margin:0;text-wrap:balance}
.ov p{margin:0;color:var(--muted)}
.ov .big{font-family:var(--f-arcade);font-size:7rem;line-height:1;color:var(--gold)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;text-align:left}
.rules div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem;color:var(--muted)}
.rules b{display:block;font-family:var(--f-card);font-weight:400;font-size:1.05rem;color:var(--ink)}
.rank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;line-height:0;align-self:center}
.qr img{display:block;width:100%;height:auto}
.ov .qr{width:min(240px,60vw)}
.invite{display:flex;gap:12px;align-items:center}
.invite .qr{width:112px;flex:none;padding:6px}
.invite .url{flex:1;min-width:0;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;user-select:all}
.code{font-family:var(--f-arcade);font-size:2.6rem;line-height:1.1;letter-spacing:.08em;color:var(--gold)}
.ovurl{font-family:var(--f-body);font-size:.95rem;color:var(--ink);overflow-wrap:anywhere;user-select:all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.mvp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:.9rem}
.mvp span{padding:3px 10px;border-radius:999px;background:var(--bg)}

/* side */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--f-arcade);font-weight:400;font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--ink);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.go{background:var(--ok);color:var(--bg);font-family:var(--f-arcade);font-weight:400;font-size:1.1rem}
.msg{font-size:.85rem;color:var(--muted);margin:0}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.feats label{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.88rem;cursor:pointer;min-width:0}
.feats input{width:18px;height:18px;margin:0;accent-color:var(--ok);flex:none}
.feats label:has(input:not(:checked)){opacity:.55}
.tog{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.tog input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.tog b{display:block;font-weight:700}
.tog small{display:block;color:var(--muted);font-size:.78rem;line-height:1.4}
.msg.warn{color:var(--warn)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.team h4{margin:0 0 6px;font-family:var(--f-card);font-weight:400;font-size:1.05rem;display:flex;justify-content:space-between;color:color-mix(in srgb,var(--tc) 60%,var(--ink))}
.team h4 .c{font-family:var(--f-body);font-size:.75rem;color:var(--muted)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.team li{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.85rem;padding:4px 8px;border-radius:7px;
  background:color-mix(in srgb,var(--tc) 14%,var(--bg));border-left:3px solid var(--tc);min-width:0}
.team li .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.team li .who small{display:block;font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.team li .s{font-variant-numeric:tabular-nums;font-weight:700}
.team li select{font-size:.75rem;padding:1px 2px;border:1px solid var(--line);border-radius:5px;background:var(--surface);max-width:5.2em}
.team li.off{opacity:.45}
.team li .kick{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;font-size:.72rem;padding:2px 7px;line-height:1.3}
.team li .kick:hover{color:var(--ink);border-color:var(--muted)}
.team li .kick[data-arm]{color:#fff;background:var(--t0);border-color:var(--t0)}
.btn.small{padding:7px 10px;font-size:.85rem}
.kickbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.kickbox .kk{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.kickbox .kk button{border:0;border-radius:999px;background:var(--ok);color:var(--bg);font-size:.72rem;padding:2px 8px}
.team li.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* student HUD */
.me{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r);
  background:color-mix(in srgb,var(--tc,var(--line)) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--tc,var(--line)) 60%,var(--surface))}
.me .who b{display:block;font-family:var(--f-arcade);font-weight:400;font-size:1.3rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{font-size:.85rem;color:var(--muted)}
.stat{text-align:center}
.stat .n{display:block;font-family:var(--f-arcade);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.stat.combo .n{color:var(--gold)}
.stat.combo.hot .n{animation:pulse .3s ease-in-out 2 alternate}

/* typing bar */
.typebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:center;z-index:20}
.typebar input{flex:1;min-width:0;font-family:var(--f-card);font-size:1.9rem;border:3px solid var(--tc,var(--line));border-radius:12px;padding:8px 16px;background:var(--bg)}
.typebar input:disabled{opacity:.55}
.typebar .clr{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:0 14px;height:52px;font-family:var(--f-card);font-size:1.05rem}
.typebar .clr:active{transform:scale(.96)}
.typebar .clr:disabled{opacity:.4}
.typebar .fb{min-width:7.5em;font-family:var(--f-arcade);font-size:1rem;text-align:right}
.fb.ok{color:var(--ok)} .fb.no{color:var(--warn)} .fb.gold{color:var(--gold)}
.shake{animation:shake .25s}

.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;resize:vertical;font:inherit;font-size:.85rem;line-height:1.45}
.card.boss{background:linear-gradient(135deg,#5b4300,#2b1f4a);border-bottom-color:#1a1230;color:#fff4cc;text-shadow:0 2px 0 #000a;box-shadow:0 0 0 3px var(--gold),0 0 22px color-mix(in srgb,var(--gold) 55%,transparent);animation:bossPulse 1s ease-in-out infinite alternate;z-index:2}
@keyframes bossPulse{to{box-shadow:0 0 0 5px var(--gold),0 0 34px color-mix(in srgb,var(--gold) 70%,transparent)}}
.card .hp{position:absolute;left:8px;right:34px;bottom:5px;height:5px;border-radius:3px;background:#0007;overflow:hidden}
.card .hp i{display:block;height:100%;background:var(--gold)}
.card .hpn{position:absolute;right:6px;bottom:1px;font-family:var(--f-arcade);font-size:.72rem;color:var(--gold);text-shadow:0 1px 0 #000}
.badge.f{background:#c9f1ff;color:#073042;box-shadow:0 2px 0 #5fb7d6}
.badge.s{background:#dfe3ff;color:#1d2470;box-shadow:0 2px 0 #7d86d8}
.badge.b{right:auto;left:-5px;background:var(--gold);color:var(--bg)}
.card.shield{box-shadow:inset 0 0 0 3px #e6f0ff,0 0 14px #8fb8ff}
.card.clue .ct{font-family:var(--f-body);font-weight:700;font-size:clamp(.72rem,1.05vw,.95rem);line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:none}
.typebar.frozen input{background:color-mix(in srgb,#c9f1ff 22%,var(--bg));border-color:#c9f1ff;box-shadow:0 0 18px #7fd8ff}
.chip .tag2{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--bg);align-self:center}
.chip .w{color:var(--gold);font-size:.85rem;letter-spacing:.05em}
.float.bad{color:#ff8a8a}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;text-align:left}
.awards div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.awards small{display:block;color:var(--muted);font-size:.75rem}
.awards b{display:block;font-family:var(--f-card);font-weight:400;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.awards span{color:var(--gold);font-size:.85rem}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.as-player .stage{grid-template-columns:1fr}
.as-player #pRoster{display:none}

@media (max-width:900px){.stage{grid-template-columns:1fr}}
@media (max-width:560px){
  .board{grid-template-columns:repeat(var(--mcols),minmax(0,1fr));gap:6px;padding:6px}
  .card{height:48px;font-size:.95rem;border-bottom-width:4px}
  .board[data-n="49"] .card{height:44px;font-size:.9rem}
  .board[data-n="64"] .card{height:40px;font-size:.82rem}
  .bar{grid-template-columns:1fr auto}
  .hudr{display:none}
  .brand h1{font-size:1.25rem}
  .timer{font-size:1.9rem}

const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];

function mqLen(n){ const o = []; do { let b = n % 128; n = Math.floor(n / 128); if (n > 0) b |= 128; o.push(b); } while (n > 0); return o; }
function mqStr(s){ const b = te8.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
function mqPkt(h, body){ const l = mqLen(body.length); const out = new Uint8Array(1 + l.length + body.length); out[0] = h; out.set(l, 1); out.set(body, 1 + l.length); return out; }

class MQ {
  constructor(url, cid, onMsg, onState){ this.url = url; this.cid = cid; this.onMsg = onMsg; this.onState = onState; this.subs = new Set(); this.ok = false; this.closed = false; this.buf = new Uint8Array(0); this.pid = 1; this.backoff = 1500; this.open(); }
  open(){
    if (this.closed) return;
    let ws; try { ws = new WebSocket(this.url, "mqtt"); } catch(e){ this.retry(); return; }
    this.ws = ws; ws.binaryType = "arraybuffer";
    ws.onopen = () => { const body = [...mqStr("MQTT"), 4, 2, 0, 30, ...mqStr(this.cid)]; this.raw(mqPkt(0x10, body)); };
    ws.onmessage = e => this.feed(new Uint8Array(e.data));
    ws.onclose = () => { if (this.ws !== ws) return; this.setOk(false); clearInterval(this.ping); this.retry(); };
    ws.onerror = () => {};
  }
  retry(){ if (this.closed) return; clearTimeout(this.rt); this.rt = setTimeout(() => this.open(), this.backoff); this.backoff = Math.min(10000, this.backoff * 1.6); }
  setOk(v){ if (this.ok === v) return; this.ok = v; try { this.onState(v); } catch(e){} }
  raw(u8){ try { if (this.ws && this.ws.readyState === 1) this.ws.send(u8); } catch(e){} }
  feed(chunk){
    const nb = new Uint8Array(this.buf.length + chunk.length); nb.set(this.buf); nb.set(chunk, this.buf.length); this.buf = nb;
    while (this.buf.length >= 2){
      let mul = 1, len = 0, i = 1, byte;
      do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mul; mul *= 128; } while (byte & 128);
      if (this.buf.length < i + len) return;
      const type = this.buf[0] >> 4, flags = this.buf[0] & 15, body = this.buf.slice(i, i + len);
      this.buf = this.buf.slice(i + len);
      if (type === 2){
        if (body[1] === 0){ this.backoff = 1500; this.setOk(true); for (const t of this.subs) this.sendSub(t); clearInterval(this.ping); this.ping = setInterval(() => this.raw(new Uint8Array([0xC0, 0])), 20000); }
        else { try { this.ws.close(); } catch(e){} }
      } else if (type === 3){
        const tl = (body[0] << 8) | body[1]; const topic = td8.decode(body.subarray(2, 2 + tl));
        const off = 2 + tl + (((flags >> 1) & 3) ? 2 : 0);
        try { this.onMsg(topic, body.slice(off)); } catch(e){ console.error(e); }
      }
    }
  }
  sendSub(t){ const id = this.pid = (this.pid % 65000) + 1; this.raw(mqPkt(0x82, [id >> 8, id & 255, ...mqStr(t), 0])); }
  subscribe(t){ this.subs.add(t); if (this.ok) this.sendSub(t); }
  publish(t, payload){ if (!this.ok) return false; const tb = mqStr(t); const body = new Uint8Array(tb.length + payload.length); body.set(tb); body.set(payload, tb.length); this.raw(mqPkt(0x30, body)); return true; }
  close(){ this.closed = true; clearTimeout(this.rt); clearInterval(this.ping); this.setOk(false); try { if (this.ws && this.ws.readyState === 1) this.raw(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch(e){} }
}

const Shim = (() => {
  const myId = "tf" + rnd(12);
  let role = "", code = "", gen = 0, topic = "", key = null, clients = [], cur = 0, curSince = 0;
  let myPres = {}, mySeq = 0, lastSend = 0, sendTimer = 0, fireT = 0, isConn = false;
  let hostPres = null, hostSeen = 0, hostSeq = -1, hostSess = "";
  const failed = !(window.WebSocket && window.crypto && crypto.subtle);
  const stu = new Map(), ph = [], ch = [];
  const fire = () => { if (fireT) return; fireT = setTimeout(() => { fireT = 0; const s = peers(); ph.forEach(h => { try { h({ peers:s, joined:[], left:[], updated:[] }); } catch(e){ console.error(e); } }); }, 0); };
  const anyOk = () => clients.some(c => c.ok);
  function updConn(){
    const c = role === "host" ? anyOk() : role === "student" ? (anyOk() && !!hostPres) : false;
    if (c === isConn) return; isConn = c; ch.forEach(h => { try { h(c); } catch(e){} });
  }
  function peers(){
    const a = [{ peer:"me", by:null, isMe:true, sameTab:true, kind:"viewer", guest:false, presence:myPres, updatedAt:Date.now() }];
    if (role === "host") for (const [id, v] of stu) a.push({ peer:id, by:null, isMe:false, sameTab:false, kind:"viewer", guest:false, presence:v.p, updatedAt:v.t });
    if (role === "student" && hostPres) a.push({ peer:"host", by:null, isMe:false, sameTab:false, kind:"viewer", guest:false, presence:hostPres, updatedAt:hostSeen });
    return a;
  }
  async function derive(c){
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", te8.encode("tflip-topic:" + c)));
    const t = "tflip3/" + Array.from(h.slice(0, 10), b => b.toString(16).padStart(2, "0")).join("");
    const k = await crypto.subtle.digest("SHA-256", te8.encode("tflip-key:" + c));
    return { t, k: await crypto.subtle.importKey("raw", k, "AES-GCM", false, ["encrypt", "decrypt"]) };
  }
  async function seal(obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, te8.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  async function unseal(u8, k){
    try { const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:u8.slice(0, 12) }, k, u8.slice(12)); return JSON.parse(td8.decode(pt)); } catch(e){ return null; }
  }
  function sendNow(extra){
    lastSend = Date.now();
    if (!key || !role) return;
    const msg = role === "host" ? { h:myPres, s:++mySeq, k:myId } : { i:myId, p:myPres, s:++mySeq, ...(extra || {}) };
    const g = gen, k = key, t = topic + (role === "host" ? "/d" : "/u");
    seal(msg).then(b => { if (g !== gen || k !== key) return; for (const c of clients) c.publish(t, b); });
  }
  function queueSend(){
    if (sendTimer) return;
    const wait = Math.max(0, (role === "host" ? 60 : 20) - (Date.now() - lastSend));
    sendTimer = setTimeout(() => { sendTimer = 0; sendNow(); }, wait);
  }
  function presence(patch){
    const n = { ...myPres }; for (const k in patch){ if (patch[k] === null) delete n[k]; else n[k] = patch[k]; } myPres = n;
    queueSend(); fire(); return Promise.resolve();
  }
  function onMsg(t, u8){
    const g = gen, k = key;
    unseal(u8, k).then(m => {
      if (!m || g !== gen) return;
      const now = Date.now();
      if (role === "host" && t === topic + "/u" && typeof m.i === "string" && m.i.length < 40){
        const prev = stu.get(m.i);
        if (m.bye){ if (stu.delete(m.i)) fire(); return; }
        if (!m.p || typeof m.p !== "object" || Array.isArray(m.p)) return;
        if (prev && typeof m.s === "number" && m.s < prev.s) return;
        stu.set(m.i, { p:m.p, t:now, s:m.s|0 });
        if (!prev) queueSend();
        fire();
      } else if (role === "student" && t === topic + "/d" && "h" in m){
        if (m.k === hostSess && typeof m.s === "number" && m.s < hostSeq) return;
        hostSess = m.k; hostSeq = m.s|0; hostSeen = now;
        hostPres = m.h && typeof m.h === "object" ? m.h : null;
        updConn(); fire();
      }
    });
  }
  function makeClient(url){ const c = new MQ(url, myId, onMsg, () => { updConn(); if (c.ok && role === "student") sendNow(); if (c.ok && role === "host") queueSend(); }); return c; }
  function teardown(){
    if (key && role === "student" && myPres.role) sendNow({ bye:1 });
    if (key && role === "host"){ myPres = {}; sendNow(); }
    const old = clients; clients = []; setTimeout(() => old.forEach(c => c.close()), 300);
    stu.clear(); hostPres = null; hostSeq = -1; hostSess = ""; key = null; topic = "";
    clearTimeout(sendTimer); sendTimer = 0;
    updConn();
  }
  async function start(r, c){
    if (failed){ ch.forEach(h => { try { h(false); } catch(e){} }); return; }
    if (role === r && code === c && key) return;
    teardown(); const g = ++gen; role = r; code = c;
    const d = await derive(c); if (g !== gen) return;
    topic = d.t; key = d.k;
    if (r === "host"){ clients = BROKERS.map(makeClient); clients.forEach(x => x.subscribe(topic + "/u")); }
    else { cur = 0; curSince = Date.now(); clients = [makeClient(BROKERS[cur])]; clients[0].subscribe(topic + "/d"); }
    fire(); updConn();
  }
  setInterval(() => {
    const now = Date.now();
    if (role === "host"){
      let ch2 = false; for (const [id, v] of stu) if (now - v.t > 12000){ stu.delete(id); ch2 = true; }
      if (ch2) fire();
      if (now - lastSend > 2500) sendNow();
    } else if (role === "student" && key){
      if (hostPres && now - hostSeen > 9000){ hostPres = null; updConn(); fire(); }
      if (now - lastSend > 3500) sendNow();
      const heard = hostSeen > curSince;
      if (!heard && now - curSince > 9000 && BROKERS.length > 1){
        clients.forEach(x => x.close());
        cur = (cur + 1) % BROKERS.length; curSince = now;
        clients = [makeClient(BROKERS[cur])]; clients[0].subscribe(topic + "/d");
      }
    }
  }, 1000);
  addEventListener("pagehide", () => { if (role === "student" && myPres.role && key) sendNow({ bye:1 }); });
  return { presence, peers,
    hostRoom:c => start("host", c), joinRoom:c => start("student", c),
    leave(){ teardown(); gen++; role = ""; code = ""; myPres = {}; fire(); },
    onPeers(h){ ph.push(h); fire(); return () => {}; },
    onConnection(h){ ch.push(h); setTimeout(() => h(isConn), 0); return () => {}; },
    connected:() => isConn, failed:() => failed, code:() => code, role:() => role,
    brokers:() => clients.filter(c => c.ok).length };
})();

function parseClues(txt){
  const out = [], seen = new Set();
  for (const line of String(txt || "").split(/\n+/)){
    const m = line.match(/^\s*([^:\t]+?)\s*[:\t]\s*(.+)$/) || line.match(/^\s*(.+?)\s+-\s+(.+)$/);

let cardKey = [];            // 카드별 마지막 모습 (바뀐 카드만 다시 그림)
let pend = {};               // 내가 맞혀서 먼저 뒤집어 둔 카드 (선생님 화면 확정 전)
let optFloat = {};           // 먼저 띄운 점수 표시 (확정 때 중복 방지)
function renderBoard(){
  const own = G.own || "", words = G.words || [], it = G.it || "";
  const mine = myEntry();
  const clue = G.md === "clue";
  const hideWords = G.ph === "lobby" || G.ph === "ready";
  if (cards.length !== (G.n || 36)) cardKey = [];
  ensureCards(G.n || 36);
  const fresh = (G.fx || []).filter(f => f[3] > prevK);
  const now = Date.now();
  const bossI = G.bs && (G.ph === "play" || G.ph === "demo") ? G.bs[0] : -1;
  const hits = bossI >= 0 ? (G.bs[1] || {}) : null;
  let wake = 0;
  for (let i=0;i<N;i++){
    const c = cards[i];
    // 먼저 뒤집어 둔 카드: 단어가 바뀌었거나(확정/다른 팀) 1.5초가 지나면 원래대로
    const pd = pend[i];
    if (pd && (words[i] !== pd.w || now - pd.at > 1500 || G.ph !== "play")) delete pend[i];
    const o = pend[i] ? pend[i].t : own[i];
    if (!hideWords && G.ph !== "demo" && prevWords[i] && words[i] && prevWords[i] !== words[i] && !reduceMotion) goneUntil[i] = now + GONE_MS;
    const gone = (goneUntil[i] || 0) > now;
    const spawning = !gone && (goneUntil[i] || 0) + 320 > now;
    if (gone) wake = Math.max(wake, goneUntil[i] - now);
    if (spawning) wake = Math.max(wake, goneUntil[i] + 330 - now);
    if (pend[i]) wake = Math.max(wake, 1500 - (now - pend[i].at) + 20);
    const w = hideWords ? "" : (words[i] || "");
    const shown = gone ? (prevWordsShown[i] || "") : w;
    if (!gone) prevWordsShown[i] = w;
    const item = gone || hideWords ? "" : it[i];
    const isBoss = !gone && !hideWords && i === bossI;
    const bn = isBoss ? (mine ? (hits[mine.t] || 0) : Math.max(0, ...Object.values(hits))) : 0;
    const shielded = !gone && !hideWords && (G.sh || "").includes(o);
    const flipNow = prevOwn && prevOwn[i] && o && prevOwn[i] !== o && !hideWords && !spawning && !gone;
    const cls = "card " + (hideWords || !okT(o) ? "n" : "t" + o) + (gone ? " gone" : spawning ? " spawn" : "") + (clue && !hideWords ? " clue" : "")
      + (shielded ? " shield" : "") + (isBoss ? " boss" : "");
    const key = cls + "|" + shown + "|" + (ITEM_NAME[item] ? item : "") + "|" + (isBoss ? bn : "");
    if (key !== cardKey[i] || flipNow){
      cardKey[i] = key;
      c.className = cls;
      if (clue && !hideWords){ c.textContent = ""; const sp = document.createElement("span"); sp.className = "ct"; sp.textContent = shown; c.appendChild(sp); }
      else c.textContent = shown;
      if (ITEM_NAME[item]){ const b = document.createElement("span"); b.className = "badge " + item; b.textContent = ITEM_NAME[item]; c.appendChild(b); }
      if (isBoss){
        const b = document.createElement("span"); b.className = "badge b"; b.textContent = "보스"; c.appendChild(b);
        const hp = document.createElement("span"); hp.className = "hp"; const bar = document.createElement("i"); bar.style.width = (bn / BOSS_HP * 100) + "%"; hp.appendChild(bar); c.appendChild(hp);
        const lab = document.createElement("span"); lab.className = "hpn"; lab.textContent = `${bn}/${BOSS_HP}`; c.appendChild(lab);
      }
      if (flipNow){ void c.offsetWidth; c.classList.add("flip"); }
    }
  }
  prevWords = words.slice();
  if (wake){ clearTimeout(renderBoard.t); renderBoard.t = setTimeout(renderBoard, wake + 10); }
  for (const f of fresh){
    if (mode === "player" && f[2] === me.sid && cards[f[0]]){
      const flag = f[5] || "", pts = f[4] | 0;
      const early = optFloat[f[0]] && now - optFloat[f[0]] < 3000; delete optFloat[f[0]];
      if (flag === "x"){ floatAt(f[0], "지뢰 " + pts, true); SFX.mine(); continue; }
      if (flag === "b"){ if (!early){ floatAt(f[0], "보스 1타"); SFX.bossHit(); } continue; }
      cards[f[0]].classList.add("mine");
      if (!early || pts !== 10 || flag) floatAt(f[0], flag === "c" ? "콤보 +" + pts : flag === "bw" ? "보스 처치 +" + pts : "+" + pts);
      const t = Date.now(); combo = t - lastHitAt < 3500 ? combo + 1 : 1; lastHitAt = t;
      const cb = $("comboBox"); cb.classList.remove("hot"); void cb.offsetWidth; if (combo >= 3) cb.classList.add("hot");
      if (flag === "c") SFX.combo(); else if (!early) SFX.hit();
    }
  }
  $("board").classList.toggle("fever", G.ph === "play" && G.fv);
  prevOwn = Array.from({ length:N }, (_, i) => pend[i] ? pend[i].t : (own[i] || "")).join("");
  prevK = G.k || 0;
  updateHints();
}
// 입력할 때마다 하는 가벼운 작업: 글자에 맞는 카드 강조만 바꿈
function updateHints(){

  const words = G.words || [], own = G.own || "";

    ["최고 타수", best(e => Math.round(e.k / mins)), v => "분당 " + v + "타"],

let inkCtx = null, wiping = false;
function inkSplash(){
  const cv = $("ink"); const r = cv.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); inkCtx = ctx;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--blot").trim() || "#04050b";
  for (let b=0; b<9; b++){
    const cx = Math.random()*r.width, cy = Math.random()*r.height, R = 40 + Math.random()*Math.min(110, r.width/6);
    ctx.globalAlpha = .93;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
    for (let s=0; s<10; s++){
      const a = Math.random()*Math.PI*2, d = R*(.8 + Math.random()*.9), rr = 4 + Math.random()*R*.28;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a)*d, cy + Math.sin(a)*d, rr, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillRect(cx - 5, cy, 10, R * (1 + Math.random()));
  }
  ctx.globalAlpha = 1;
  cv.classList.remove("fade"); cv.classList.add("on");
  clearTimeout(inkSplash.t1); clearTimeout(inkSplash.t2);
  inkSplash.t1 = setTimeout(() => cv.classList.add("fade"), 4000);
  inkSplash.t2 = setTimeout(() => cv.classList.remove("on","fade"), 6300);
}
function wipe(ev){
  if (!inkCtx || !$("ink").classList.contains("on")) return;
  const r = $("ink").getBoundingClientRect();
  inkCtx.globalCompositeOperation = "destination-out";
  inkCtx.beginPath(); inkCtx.arc(ev.clientX - r.left, ev.clientY - r.top, 34, 0, Math.PI*2); inkCtx.fill();
}
$("ink").addEventListener("pointerdown", e => { wiping = true; wipe(e); });
$("ink").addEventListener("pointermove", e => { if (wiping || e.pointerType === "mouse") wipe(e); });
addEventListener("pointerup", () => { wiping = false; });

function confetti(teams, big){
  if (reduceMotion) return;
  const cv = $("confetti"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.hidden = false;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = (teams.length ? teams : ["0","1"]).map(t => cs.getPropertyValue("--t" + t).trim()).concat([cs.getPropertyValue("--gold").trim(), "#ffffff"]);
  const P = Array.from({ length: big ? 220 : 120 }, () => ({ x: innerWidth/2 + (Math.random()-.5)*innerWidth*.3, y: innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, h:8+Math.random()*8, c:pick(cols) }));
  const t0 = performance.now(), D = big ? 3800 : 2600;
  (function step(t){
    const k = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P){ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - k / D); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore(); }
    if (k < D) requestAnimationFrame(step); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

function runEv(e){
  const [, type, t, sid, idxs, target] = e;
  const mine = myEntry();
  const inMatch = mine && (G.act || "").includes(mine.t);
  if (type === "ink"){
    toast(`${TN[+t] || ""} 팀 먹물 공격!`, t); SFX.ink();
    document.querySelectorAll("#scores .chip").forEach(c => { if (c.dataset.t !== t){ c.classList.remove("hit"); void c.offsetWidth; c.classList.add("hit"); } });
    if (mode === "player" && inMatch && mine.t !== t) inkSplash();
  } else if (type === "mis"){
    if (idxs && idxs.length){ toast(`${TN[+t] || ""} 팀 미사일 발사 → ${TN[+target] || ""} 팀`, t); SFX.missile(); missileFly(t, idxs); }
    else toast("미사일이 방패에 막혔습니다", t);
  } else if (type === "ice"){

    toast(`${TN[+t] || ""} 팀 얼음 공격! ${sec}초 동안 입력 정지`, t); SFX.ice();
    if (mode === "player" && inMatch && mine.t !== t){ frozenUntil = Date.now() + ms; setTimeout(render, ms + 50); }
  } else if (type === "shield"){
    const ms = Math.min(5000, Math.max(500, +target || 2000)), sec = String(Math.round(ms / 100) / 10);
    toast(`${TN[+t] || ""} 팀 방패 ${sec}초!`, t); SFX.shield();
  } else if (type === "mine"){
    toast(`지뢰! ${nameOf(sid)} -${MINE_PTS}점`, t); SFX.mine(); boomAt(idxs);
  } else if (type === "storm"){
    toast("카드 폭풍! 카드가 뒤섞입니다", "g"); SFX.storm();
  } else if (type === "boss"){
    toast(`보스 등장! 같은 팀이 ${BOSS_HP}번 맞히면 +${BOSS_PTS}`, "g"); SFX.boss();
  } else if (type === "bossw"){
    toast(`${TN[+t] || ""} 팀 보스 처치! +${BOSS_PTS}`, t); SFX.win(); boomAt(idxs);
  } else if (type === "bossx"){
    toast("보스가 도망갔습니다", "g");
  } else if (type === "cb"){
    toast(`역전 찬스! ${TN[+t] || ""} 팀 10초 동안 점수 2배`, t); SFX.chance();
  } else if (type === "pv"){
    toast(`속담 성공! ${nameOf(sid)} +${(G.fv ? PV_PTS*2 : PV_PTS)}`, "g"); SFX.proverb();
  } else if (type === "pvon"){

  } else if (type === "fv"){
    toast("피버 타임! 점수 2배", "g"); SFX.fever();
  } else if (type === "end"){
    const win = String(t || "").split("").filter(okT);
    if (target === "1"){ SFX.win(); confetti(win, true); } else { SFX.end(); confetti(win, false); }
  }
}
function processEvents(){
  const ek = G.ek || 0;
  if (seenEk < 0 || ek < seenEk){ seenEk = ek; return; }
  for (const e of G.ev || []){
    if (!Array.isArray(e) || typeof e[0] !== "number" || e[0] <= seenEk) continue;
    seenEk = e[0]; runEv(e);
  }
}

function findHost(){
  if (!room) return null;
  let best = null;
  for (const p of room.peers()){
    const pr = p.presence;
    if (pr && pr.role === "host" && pr.g && pr.g.v === V && !(p.isMe && p.sameTab && mode !== "host")){
      if (!best || (pr.since||0) < (best.presence.since||0)) best = p;
    }
  }
  return best;
}

function onRoom(){
  if (mode === "host"){ hostSync(); return; }

  const idxs = []; (G.words || []).forEach((x, k) => { if (x === w) idxs.push(k); });
  if (!idxs.length){
    bump(w); setPresence({ st:{ ...myStats } });
    clearInput(); updateHints(); renderPv();
    feedback("틀림", "no"); SFX.miss(); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); return;
  }
  const bossI = G.bs && idxs.includes(G.bs[0]) ? G.bs[0] : -1;
  const i = bossI >= 0 ? bossI : idxs.find(k => G.own[k] !== e.t && !(G.sh || "").includes(G.own[k]));
  if (i === undefined){
    bump(w); setPresence({ st:{ ...myStats } });
    feedback(idxs.some(k => G.own[k] !== e.t) ? "방패 중" : "이미 우리 팀", "no"); clearInput(); renderBoard(); return;
  }
  bump(w); claim([i, w]);
  if (bossI < 0){ pend[i] = { w, t:e.t, at:Date.now() }; optFloat[i] = Date.now(); floatAt(i, "+10"); SFX.hit(); }
  else { optFloat[i] = Date.now(); floatAt(i, "보스 1타"); SFX.bossHit(); }
  clearInput(); feedback(bossI >= 0 ? "보스 공격!" : "뒤집기!", "ok"); renderBoard(); renderPv();
}

// ---------- host ----------
function hostPublish(){
  const g = encode(H);
  setPresence({ role:"host", since:H.since, g });
  H.savedAt = Date.now();
  if (!hostPublish.saveT) hostPublish.saveT = setTimeout(() => { hostPublish.saveT = 0; if (H) store.set("tf-host", H); }, 1500);
  G = decode(g); render();
}

function buildPool(lang, cw){ return lang === "custom" ? parseWords(cw) : lang === "clue" ? parseClues(cw) : pool(lang); }
const shownOf = k => H.clue ? H.pool[k][1] : H.pool[k];
function drawEntry(){
  for (let tries=0; tries<400; tries++){
    if (!bag.length) bag = shuffle(H.pool.map((_, k) => k));
    const k = bag.pop();
    if (!H.words.includes(shownOf(k))) return k;
  }
  return Math.floor(Math.random() * H.pool.length);
}
function fillCard(i){ const k = drawEntry(); H.words[i] = shownOf(k); if (H.clue) H.ans[i] = H.pool[k][0]; }
function pushEv(type, t = "", sid = "", idxs = [], target = ""){
  H.ek++; H.ev = H.ev.concat([[H.ek, type, t, sid, idxs, target]]).slice(-6);
}
function setOwn(i, t){ H.own = H.own.slice(0,i) + t + H.own.slice(i+1); }
function setIt(i, c){ H.it = H.it.slice(0,i) + c + H.it.slice(i+1); }
function replaceCard(i){ fillCard(i); setIt(i, "."); }
function stealCards(fromTeams, toTeam, n){
  const bi = H.boss ? H.boss.i : -1;
  const idx = shuffle([...H.own].map((c, i) => fromTeams.includes(c) && i !== bi ? i : -1).filter(i => i >= 0)).slice(0, n);
  for (const i of idx){ setOwn(i, toTeam); replaceCard(i); }
  return idx;
}

function teamsForJoin(){ return (H.ph === "play" || H.ph === "ready") && H.act ? H.act.split("") : teamIds(H.nt); }
function pickTeam(){
  const ts = teamsForJoin();
  const c = ts.map(t => H.ro.filter(e => e.t === t).length);
  const min = Math.min(...c);
  return pick(ts.filter((t, i) => c[i] === min));
}
function reshuffle(){
  const ts = shuffle(teamIds(H.nt));
  shuffle(H.ro).forEach((e, i) => { e.t = ts[i % ts.length]; });
}

  }

             act:"", n:36, late:true, left:0, words:[], ans:null, pool:[], clue:false, own:"", it:"", ro:[], x:[], fx:[], ev:[], ek:0, bp:[], pv:null, fv:false, used:[], k:0,
             sh:{}, fz:{}, stk:{}, boss:null, cb:null, feat:{ ...featPref }, kick:[] };

function handleClaim(e, sid, i, w, now){
  if ((H.fz[e.t] || 0) > now) return false;
  const base = H.fv ? 2 : 1;
  const mult = base * (H.cb && H.cb.t === e.t && H.cb.end > now ? 2 : 1);
  const others = H.act.split("").filter(t => t !== e.t);
  if (i === -1){
    if (!H.pv || now > H.pv.end || norm(w) !== norm(PV[H.pv.i])) return false;
    const pts = PV_PTS * base;
    H.bp[+e.t] = (H.bp[+e.t] || 0) + pts; e.s += pts; e.p = (e.p|0) + 1;
    H.pv = null; H.nextPv = now + 18000;
    pushEv("pv", e.t, sid);
    return true;
  }
  if (i === -2){
    if (!H.clue) return false;
    const nw = norm(w), cand = [];
    for (let k=0; k<H.n; k++) if (H.ans[k] && norm(H.ans[k]) === nw) cand.push(k);
    if (!cand.length) return false;
    let k = cand.find(k => H.boss && H.boss.i === k);
    if (k === undefined) k = cand.find(k => H.own[k] !== e.t && !((H.sh[H.own[k]] || 0) > now));
    if (k === undefined) return false;
    i = k;
  } else if (!Number.isInteger(i) || i < 0 || i >= H.n || H.words[i] !== w) return false;

  if (H.boss && H.boss.i === i){
    const hits = H.boss.hits; hits[e.t] = (hits[e.t] || 0) + 1; e.b = (e.b|0) + 1; H.k++;
    if (hits[e.t] >= BOSS_HP){
      const pts = BOSS_PTS * base;
      H.bp[+e.t] = (H.bp[+e.t] || 0) + pts; e.s += pts;
      setOwn(i, e.t); replaceCard(i); H.boss = null;
      H.fx = H.fx.concat([[i, e.t, sid, H.k, pts, "bw"]]).slice(-8);
      pushEv("bossw", e.t, sid, [i]);
    } else H.fx = H.fx.concat([[i, e.t, sid, H.k, 0, "b"]]).slice(-8);
    return true;
  }
  if (H.own[i] === e.t) return false;
  if ((H.sh[H.own[i]] || 0) > now) return false;
  const item = H.it[i];
  if (item === "x"){
    H.bp[+e.t] = (H.bp[+e.t] || 0) - MINE_PTS; e.s -= MINE_PTS; e.mn = (e.mn|0) + 1;
    replaceCard(i); H.k++;
    H.fx = H.fx.concat([[i, e.t, sid, H.k, -MINE_PTS, "x"]]).slice(-8);
    pushEv("mine", e.t, sid, [i]);
    return true;
  }
  setOwn(i, e.t); replaceCard(i);
  const st = H.stk[sid] || { t:0, n:0 }; st.n = now - st.t < 3000 ? st.n + 1 : 1; st.t = now; H.stk[sid] = st;
  let pts = 10 * mult, flag = "";
  if (st.n % 5 === 0 && feat("combo")){ pts += COMBO_PTS; flag = "c"; }
  e.s += pts; e.h = (e.h|0) + 1;
  H.bp[+e.t] = (H.bp[+e.t] || 0) + pts - 10;
  H.k++; H.fx = H.fx.concat([[i, e.t, sid, H.k, pts, flag]]).slice(-8);
  if (item === "i") pushEv("ink", e.t, sid);
  if (item === "f"){ const ms = itemCfg().ice; for (const t of others) H.fz[t] = now + ms; pushEv("ice", e.t, sid, [], String(ms)); }
  if (item === "s"){ const ms = itemCfg().shield; H.sh[e.t] = now + ms; pushEv("shield", e.t, sid, [], String(ms)); }
  if (item === "m"){
    const avail = others.filter(t => !((H.sh[t] || 0) > now));
    if (avail.length){
      const sc = avail.map(t => count(H.own, t)); const top = Math.max(...sc);
      const target = pick(avail.filter((t, k) => sc[k] === top));
      const idxs = stealCards([target], e.t, 3);
      e.s += idxs.length * 10 * mult; e.m = (e.m|0) + 1;
      H.bp[+e.t] += idxs.length * 10 * (mult - 1);
      pushEv("mis", e.t, sid, idxs, target);
    } else pushEv("mis", e.t, sid, [], "");
  }
  return true;
}

function hostSync(force){
  if (mode !== "host" || !H) return;
  let changed = !!force;
  const now = Date.now();
  const present = new Map();
  for (const pe of room.peers()){
    const p = pe.presence;
    if (!p || p.role !== "p" || !okSid(p.sid)) continue;
    const prev = present.get(p.sid);
    if (!prev || pe.updatedAt > prev.updatedAt) present.set(p.sid, pe);
  }
  const safeName = s => { const n = clean(s, 10); return n && !isBad(n) ? n : "이름 없음"; };
  const inGame = H.ph === "play" || H.ph === "ready";
  const lateOk = !inGame || H.late !== false;
  for (const e of H.ro){
    const pe = present.get(e.id); let on = pe ? 1 : 0;
    if (on && !e.on && !lateOk) on = 0;
    if (e.on !== on){ e.on = on; changed = true; }
    if (pe){
      const nm = safeName(pe.presence.nm); if (nm !== e.n){ e.n = nm; changed = true; }
      const st = pe.presence.st;
      if (st && st.g === H.gid && (st.a|0) >= 0){ const a = Math.min(9999, st.a|0), k = Math.min(99999, st.k|0); if (a !== e.a || k !== e.k){ e.a = a; e.k = k; } }   // 타수·시도 기록은 1초마다 오는 정기 전송에 실어 보냄
    }
  }
  if (H.ph === "lobby"){
    const before = H.ro.length; H.ro = H.ro.filter(e => e.on);
    if (H.ro.length !== before) changed = true;
  }
  if ((H.ph === "lobby" || H.ph === "end") && H.ro.length > H.mx){ H.ro = H.ro.slice(0, H.mx); changed = true; }

  const x = [];
  for (const [sid, pe] of present){
    if (H.ro.some(e => e.id === sid)) continue;
    if ((H.kick || []).some(k => k.id === sid)) continue;
    if (!lateOk) continue;
    if (H.ro.length >= H.mx){ x.push(sid); continue; }
    H.ro.push({ id:sid, n:safeName(pe.presence.nm), t:pickTeam(), s:0, on:1, h:0, m:0, p:0, b:0, a:0, k:0, mn:0 });
    changed = true;
  }
  if (JSON.stringify(x) !== JSON.stringify(H.x)){ H.x = x; changed = true; }
  if (H.ph === "lobby"){ const n = sizeFor(H.ro.length); if (n !== H.n){ H.n = n; changed = true; } }

  for (const [sid, pe] of present){
    const cl = Array.isArray(pe.presence.cl) ? pe.presence.cl.slice().sort((a,b)=>(a?.[2]||0)-(b?.[2]||0)) : [];
    let last = lastN.get(pe.peer) || 0;
    for (const c of cl){
      if (!Array.isArray(c)) continue;
      const [i, w, n] = c;
      if (typeof n !== "number" || n <= last) continue;
      last = n;
      if (H.ph !== "play") continue;
      const e = H.ro.find(r => r.id === sid);
      if (!e || !e.on || typeof w !== "string" || w.length > 80) continue;
      if (handleClaim(e, sid, i, w, now)) changed = true;
    }
    lastN.set(pe.peer, last);
  }
  if (changed) hostPublish();
}

function kickPlayer(id, btn){
  if (!H) return;
  const e = H.ro.find(r => r.id === id); if (!e) return;
  if (e.on && !btn.dataset.arm){
    btn.dataset.arm = "1"; btn.textContent = "확인";
    setTimeout(() => { if (btn.isConnected){ delete btn.dataset.arm; btn.textContent = "빼기"; } }, 3000);
    return;
  }
  H.ro = H.ro.filter(r => r.id !== id);
  H.kick = H.kick || [];

  $("hMsg").textContent = e.on ? `${e.id} ${e.n} 학생을 게임에서 뺐습니다. 아래 '다시 허용'을 누르면 다시 들어올 수 있습니다.` : `끊긴 ${e.id} ${e.n} 학생을 명단에서 지웠습니다. 다시 접속하면 새로 참가합니다.`;
  hostPublish();
}
function allowPlayer(id){
  if (!H) return;

  H.kick = (H.kick || []).filter(k => k.id !== id);

function hostMove(sid, t){
  const e = H.ro.find(r => r.id === sid); if (!e || !okT(t) || +t >= H.nt) return;
  e.t = t; hostPublish();
}

function pickPv(){
  const [a, b] = pvRange(H.lang === "en" ? "en" : H.lang === "mix" ? "mix" : "ko");
  const all = Array.from({length:b-a}, (_, k) => a + k);
  let cand = all.filter(i => !H.used.includes(i));
  if (!cand.length){ H.used = []; cand = all; }
  const i = pick(cand); H.used.push(i); return i;
}
function placeItem(){
  const bi = H.boss ? H.boss.i : -1;
  const free = []; for (let i=0;i<H.n;i++) if (H.it[i] === "." && i !== bi) free.push(i);
  if (!free.length) return;
  const c = itemCfg();
  const onBoard = ch => H.it.includes(ch);
  const fw = onBoard("f") ? 0 : c.fw, sw = onBoard("s") ? 0 : c.sw;   // 얼음·방패는 판에 한 장씩만
  const w = [["m", .26], ["i", .26], ["x", .16], ["f", fw], ["s", sw]].filter(x => feat(x[0]));
  if (!w.length) return;
  let r = Math.random() * w.reduce((a, b) => a + b[1], 0), pickCh = "m";
  for (const [ch, v] of w){ if ((r -= v) < 0){ pickCh = ch; break; } }
  setIt(pick(free), pickCh);
}
// 팀 수에 따라 얼음·방패의 빈도(가중치)와 지속 시간을 조절
function itemCfg(){
  const n = Math.max(2, (H && H.act ? H.act.length : 2));
  if (n <= 2) return { fw:.04, sw:.04, ice:1500, shield:2000 };
  if (n === 3) return { fw:.08, sw:.08, ice:2000, shield:3000 };
  if (n <= 5) return { fw:.12, sw:.12, ice:2500, shield:4000 };
  return { fw:.18, sw:.16, ice:3000, shield:5000 };
}
const itemCount = () => [...H.it].filter(c => c !== ".").length;

function spawnBoss(now){
  const free = []; for (let i=0;i<H.n;i++) if (H.it[i] === ".") free.push(i);
  if (!free.length) return;
  const i = pick(free);
  if (!H.clue){
    const longs = H.pool.filter(w => [...w].length >= 4 && !H.words.includes(w));
    if (longs.length) H.words[i] = pick(longs);
  }
  setOwn(i, "-");                       // 어느 팀 것도 아닌 중립 카드
  H.boss = { i, hits:{}, end: now + 25000 };
  pushEv("boss", "", "", [i]);
}
// 보스가 시간 안에 처치되지 않으면: 가장 많이 맞힌 팀이 차지, 아무도 못 맞혔으면 무작위 팀
function bossEscape(){
  if (!H.boss) return;
  const i = H.boss.i, hits = H.boss.hits, ts = H.act.split("");
  const best = Math.max(0, ...ts.map(t => hits[t] || 0));
  const top = ts.filter(t => (hits[t] || 0) === best);
  setOwn(i, best > 0 && top.length === 1 ? top[0] : pick(ts));
  replaceCard(i);
  H.boss = null;
}
function storm(){
  const perm = shuffle([...Array(H.n).keys()]);
  const w = [], a = [], o = [], it = [];
  perm.forEach((p, k) => { w[k] = H.words[p]; if (H.ans) a[k] = H.ans[p]; o[k] = H.own[p]; it[k] = H.it[p]; });
  H.words = w; if (H.ans) H.ans = a; H.own = o.join(""); H.it = it.join("");
  if (H.boss) H.boss.i = perm.indexOf(H.boss.i);
  pushEv("storm");
}

function hostStart(){
  if (!H.ro.length){ $("hMsg").textContent = "참가자가 한 명 이상 입장해야 시작할 수 있습니다."; return; }
  const cont = H.ph === "end" && H.rounds > 1 && !H.matchOver;
  const lang = $("selLang").value, cw = $("customWords").value;
  const pl = buildPool(lang, cw);
  if (lang === "custom" && pl.length < 8){ $("hMsg").textContent = "직접 입력한 단어가 8개 이상 있어야 시작할 수 있습니다."; return; }
  if (lang === "clue" && pl.length < 6){ $("hMsg").textContent = "'용어 : 뜻' 줄이 6개 이상 있어야 시작할 수 있습니다."; return; }
  if (!cont){ H.rounds = Number($("selRounds").value); H.rn = 1; H.wins = Array(H.nt).fill(0); H.matchOver = false; }
  else H.rn++;
  H.dur = Number($("selDur").value); H.lang = lang; H.cw = cw; H.pool = pl; H.clue = lang === "clue";
  let act = teamIds(H.nt).filter(t => H.ro.some(e => e.t === t));
  for (const t of teamIds(H.nt)){ if (act.length >= 2) break; if (!act.includes(t)) act.push(t); }
  act.sort();
  H.act = act.join("");
  bag = [];
  H.n = sizeFor(H.ro.length);
  H.words = Array(H.n).fill(""); H.ans = H.clue ? Array(H.n).fill("") : null;
  for (let i=0;i<H.n;i++) fillCard(i);
  const order = shuffle(act);
  H.own = shuffle(Array.from({length:H.n}, (_, i) => order[i % order.length])).join("");
  H.boss = null;
  H.it = ".".repeat(H.n); for (let k=0;k<Math.round(H.n/12);k++) placeItem();
  H.bp = Array(H.nt).fill(0);
  H.ro.forEach(e => { e.s = 0; e.h = 0; e.m = 0; e.p = 0; e.b = 0; e.a = 0; e.k = 0; e.mn = 0; });
  H.fx = []; H.k = 0; H.pv = null; H.fv = false; H.used = H.used || [];
  H.sh = {}; H.fz = {}; H.stk = {}; H.cb = null; H.didBoss = false; H.didStorm = false; H.didCb = false;
  H.gid = (H.gid|0) + 1;
  H.ph = "ready"; H.left = 3; H.readyAt = Date.now() + 3000;
  lastN = new Map(room.peers().map(p => [p.peer, Math.max(0, ...((p.presence?.cl)||[]).map(c => (Array.isArray(c) && c[2]) || 0))]));
  const empty = H.nt - teamIds(H.nt).filter(t => H.ro.some(e => e.t === t)).length;
  $("hMsg").textContent = (H.rounds > 1 ? `라운드 ${H.rn} / ${H.rounds} 시작. ` : "") + (empty > 0 ? `참가자가 없는 ${empty}개 팀은 빼고 시작합니다.` : "게임이 시작됩니다.");
  hostPublish();
}

function endRound(){
  bossEscape();
  H.ph = "end"; H.left = 0; H.pv = null; H.fv = false; H.boss = null; H.cb = null; H.sh = {}; H.fz = {};
  const ts = H.act.split("");
  const sc = ts.map(t => count(H.own, t) * 10 + (H.bp[+t] || 0));
  const top = Math.max(...sc);
  const winners = ts.filter((t, k) => sc[k] === top);
  if (winners.length === 1) H.wins[+winners[0]] = (H.wins[+winners[0]] || 0) + 1;
  const need = Math.ceil((H.rounds || 1) / 2);
  H.matchOver = (H.rounds || 1) <= 1 || H.wins.some(w => w >= need) || H.rn >= H.rounds;
  pushEv("end", winners.join(""), "", [], H.matchOver ? "1" : "");
  $("hMsg").textContent = H.matchOver ? "게임이 끝났습니다." : `라운드 ${H.rn} 종료. '라운드 ${H.rn + 1} 시작'을 누르면 이어집니다.`;
  hostPublish();
}

function hostLobby(){
  H.ph = "lobby"; H.words = []; H.ans = null; H.own = ""; H.it = ""; H.fx = []; H.k = 0; H.left = 0; H.act = ""; H.pv = null; H.fv = false;
  H.boss = null; H.cb = null; H.sh = {}; H.fz = {}; H.rn = 0; H.wins = []; H.matchOver = false;
  H.ro.forEach(e => { e.s = 0; e.h = 0; e.m = 0; e.p = 0; e.b = 0; e.a = 0; e.k = 0; e.mn = 0; });
  $("hMsg").textContent = "참가자 옆 목록에서 팀을 바꿀 수 있습니다.";
  hostSync(true);
}

function hostTick(){
  if (mode !== "host" || !H) return;
  const now = Date.now();
  if (H.ph === "ready"){
    const l = Math.ceil((H.readyAt - now)/1000);
    if (l <= 0){
      H.ph = "play"; H.endAt = now + H.dur*1000; H.left = H.dur;
      H.nextIt = now + 5000; H.nextPv = now + Math.min(15000, H.dur*1000/4);
      hostPublish();
    } else if (l !== H.left){ H.left = l; SFX.tick(); hostPublish(); }
  } else if (H.ph === "play"){
    const l = Math.max(0, Math.ceil((H.endAt - now)/1000));
    if (l <= 0){ endRound(); return; }
    let ch = l !== H.left; H.left = l;
    const f = (H.dur - l) / H.dur;
    const fv = l <= 10 && feat("fever");
    if (fv !== H.fv){ H.fv = fv; if (fv) pushEv("fv"); ch = true; }
    if (now >= H.nextIt){ H.nextIt = now + 4000 + Math.random()*4000; if (itemCount() < Math.round(H.n/9)){ placeItem(); ch = true; } }
    if (!H.clue){
      if (H.pv && now >= H.pv.end){ H.pv = null; H.nextPv = now + 12000; ch = true; }
      if (!H.pv && now >= H.nextPv && l > 14 && feat("pv")){ H.pv = { i:pickPv(), end: now + 15000 }; pushEv("pvon"); ch = true; }
    }
    if (!H.didBoss && f >= .3 && l > 20 && feat("boss")){ H.didBoss = true; spawnBoss(now); ch = true; }
    if (H.boss && now >= H.boss.end){ bossEscape(); pushEv("bossx"); ch = true; }
    if (!H.didStorm && f >= .5 && l > 12 && feat("storm")){ H.didStorm = true; storm(); ch = true; }
    if (!H.didCb && f >= .6 && l > 12 && feat("cb")){
      H.didCb = true;
      const ts = H.act.split(""); const sc = ts.map(t => count(H.own, t) * 10 + (H.bp[+t] || 0));
      const lo = Math.min(...sc), hi = Math.max(...sc);
      if (hi - lo >= 30){ const t = ts[sc.indexOf(lo)]; H.cb = { t, end: now + 10000 }; pushEv("cb", t); ch = true; }
    }
    if (H.cb && now >= H.cb.end){ H.cb = null; ch = true; }
    if (ch) hostPublish();
  }
}

function hostOff(){
  setPresence({ role:null, since:null, g:null });
  store.del("tf-host"); store.del("tf-code");
  Shim.leave();
  mode = "join"; H = null; G = demoState(); prevOwn = ""; seenEk = -1; onRoom();
}

// ---------- wiring ----------
$("inSid").value = me.sid || ""; $("inName").value = me.nm || "";
$("pJoin").addEventListener("submit", join);
$("btnLeave").onclick = leave;
$("btnHost").onclick = () => hostStartAsHost(false);
$("btnKickOff").onclick = () => {
  if (!H) return;
  const n = H.ro.filter(e => !e.on).length;
  H.ro = H.ro.filter(e => e.on);
  $("hMsg").textContent = `끊긴 학생 ${n}명을 명단에서 지웠습니다. 다시 접속하면 새로 참가합니다.`;
  hostPublish();
};
// 게임 도중에도 방 코드만 새로 받기 (두 번 눌러 확인)
$("btnNewCode").onclick = () => {
  if (!H) return;
  const b = $("btnNewCode");
  if (!b.dataset.arm){
    b.dataset.arm = "1"; b.textContent = "한 번 더 누르면 코드가 바뀝니다";
    clearTimeout(b.t); b.t = setTimeout(() => { delete b.dataset.arm; b.textContent = "방 코드 새로 받기"; }, 4000);
    return;
  }
  delete b.dataset.arm; clearTimeout(b.t); b.textContent = "방 코드 새로 받기";
  setPresence({ role:null, since:null, g:null });
  const old = ROOM;
  ROOM = newCode(); store.set("tf-code", ROOM);
  qrData = ""; $("qrSmall").textContent = "";
  H.ro = []; H.x = []; H.kick = []; H.since = Date.now();
  if (H.ph !== "lobby"){ H.ph = "lobby"; H.words = []; H.ans = null; H.own = ""; H.it = ""; H.fx = []; H.k = 0; H.left = 0; H.act = ""; H.pv = null; H.fv = false; H.boss = null; H.cb = null; H.sh = {}; H.fz = {}; H.rn = 0; H.wins = []; H.matchOver = false; }
  lastN = new Map(); renderOverlay.sig = renderRoster.sig = renderTop.sig = "";
  Shim.hostRoom(ROOM);
  $("hMsg").textContent = `방 코드를 ${old}에서 ${ROOM}(으)로 바꿨습니다. 학생들은 새 QR 코드나 링크로 다시 들어와야 합니다.`;
  hostPublish();
};
$("btnStart").onclick = hostStart;
$("btnLobby").onclick = hostLobby;
$("btnHostOff").onclick = hostOff;
$("btnCopy").onclick = () => {
  const done = () => { $("btnCopy").textContent = "복사됨"; setTimeout(() => { $("btnCopy").textContent = "링크 복사"; }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("inviteUrl")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("btnCopy").textContent = "Ctrl+C로 복사하세요"; };
  try { navigator.clipboard.writeText(inviteUrl()).then(done, fallback); } catch(e){ fallback(); }
};
$("btnClr").addEventListener("pointerdown", e => e.preventDefault());
$("btnClr").onclick = () => { pendingSubmit = false; clearInput(); $("typeIn").focus(); updateHints(); renderPv(); };
function renderFeats(){
  const box = $("featBox"); box.textContent = "";
  for (const [k, name] of FEATS){
    const lab = document.createElement("label"); lab.htmlFor = "ft_" + k;
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "ft_" + k; cb.checked = feat(k);
    cb.onchange = () => setFeat(k, cb.checked);
    lab.append(cb, document.createTextNode(name)); box.appendChild(lab);
  }
}
function setFeat(k, on){
  featPref = { ...featPref, [k]: on }; store.set("tf-feat", featPref);
  if (!H) return;
  H.feat = { ...(H.feat || {}), [k]: on };
  if (!on){
    if (k.length === 1 && H.it) H.it = H.it.split(k).join(".");                       // 판에 있던 그 아이템 카드 없애기
    if (k === "boss" && H.boss){ bossEscape(); }
    if (k === "pv") H.pv = null;
    if (k === "cb") H.cb = null;
    if (k === "fever") H.fv = false;
    if (k === "f") H.fz = {};
    if (k === "s") H.sh = {};
  }
  const name = (FEATS.find(f => f[0] === k) || [k, k])[1];
  const last = name.charCodeAt(name.length - 1), josa = last >= 0xAC00 && last <= 0xD7A3 && (last - 0xAC00) % 28 ? "을" : "를";
  $("hMsg").textContent = `${name}${josa} ${on ? "켰습니다" : "껐습니다"}.`;
  hostPublish();
}
renderFeats();
$("btnSnd").onclick = () => { soundOn = !soundOn; store.set("tf-snd", soundOn); if (soundOn) ensureAudio(); renderSnd(); };
$("btnShuffle").onclick = () => { if (!H) return; reshuffle(); $("hMsg").textContent = "팀을 무작위로 다시 나눴습니다."; hostPublish(); };
$("chkLate").onchange = () => {
  if (!H) return; H.late = $("chkLate").checked;
  $("hMsg").textContent = H.late ? "게임 중에도 입장할 수 있습니다. 튕긴 학생은 점수를 그대로 가지고 돌아옵니다." : "게임 중 입장을 막았습니다. 이번 판이 끝나면 다시 들어올 수 있습니다.";
  hostSync(true);
};
$("selTeams").onchange = () => {
  if (!H) return; H.nt = Number($("selTeams").value); reshuffle(); H.wins = []; H.matchOver = true;
  $("hMsg").textContent = `${H.nt}팀으로 무작위 배정했습니다.`; hostPublish();
};
$("selMax").onchange = () => {
  if (!H) return; H.mx = Number($("selMax").value);
  $("hMsg").textContent = `최대 인원을 ${H.mx}명으로 바꿨습니다.`; hostSync(true);
};
$("selDur").onchange = () => { if (!H) return; H.dur = Number($("selDur").value); hostPublish(); };
$("selLang").onchange = () => { cwRefresh(); if (!H) return; H.lang = $("selLang").value; hostPublish(); };
$("selRounds").onchange = () => { if (!H) return; H.rounds = Number($("selRounds").value); hostPublish(); };
$("customWords").addEventListener("input", () => { store.set("tf-cw", $("customWords").value); if (H) H.cw = $("customWords").value; cwRefresh(); });

const ti = $("typeIn");
const isWord = v => (G.words || []).includes(v.trim());
const spaceSubmits = v => {
  if (G.md === "clue") return false;
  if (pvTyping(v) && !isWord(v)) return false;
  const t = v.trim();
  if (!isWord(t) && (G.words || []).some(w => w.startsWith(t + " "))) return false;
  return true;
};
// Enter는 결과와 상관없이 항상 입력창을 비웁니다 (한글 입력 중 마지막 글자가 다시 남는 것도 막음)
let enterGuard = 0, lastEntered = "";
const isLeftover = v => !!v && !!lastEntered && lastEntered.endsWith(v) && [...v].length <= 1;
function enterSubmit(){
  lastEntered = $("typeIn").value.trim();
  submitWord();
  clearInput();
  enterGuard = Date.now() + 200;
  setTimeout(() => { const v = $("typeIn").value; if (isLeftover(v)) $("typeIn").value = ""; }, 60);
  renderBoard(); renderPv();
}
ti.addEventListener("compositionstart", () => { composing = true; });
ti.addEventListener("compositionend", () => { composing = false; });
ti.addEventListener("keydown", e => {
  ensureAudio();
  if (e.key === "Escape" || (e.key === "Backspace" && (e.ctrlKey || e.altKey || e.metaKey))){
    e.preventDefault(); pendingSubmit = false; clearInput(); feedback("지움", "no"); updateHints(); renderPv(); return;
  }
  if (e.key === "Enter"){
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229){ pendingSubmit = true; return; }
    enterSubmit(); return;
  }
  if (e.key === " " || e.code === "Space"){
    if (!spaceSubmits(ti.value)) return;
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229){ pendingSubmit = true; return; }
    submitWord();
  }
});
ti.addEventListener("compositionend", () => { if (pendingSubmit){ pendingSubmit = false; setTimeout(enterSubmit, 0); } });
ti.addEventListener("input", () => {
  if (Date.now() < enterGuard && isLeftover(ti.value)){ ti.value = ""; updateHints(); renderPv(); return; }
  if (/\s$/.test(ti.value) && spaceSubmits(ti.value)){ ti.value = ti.value.trim(); submitWord(); }
  else { updateHints(); renderPv(); }
});

setInterval(hostTick, 200);
setInterval(() => { if (mode === "player" && combo && Date.now() - lastHitAt > 3500){ combo = 0; $("myCombo").textContent = 0; } }, 500);
if (location.hostname === "127.0.0.1") window.__tf = { get H(){ return H; }, get G(){ return G; }, hostPublish, placeItem };
addEventListener("pagehide", () => { if (H){ H.savedAt = Date.now(); store.set("tf-host", H); } });
renderSnd();
render();

room = Shim;
room.onConnection(c => {
  connected = c;
  $("dot").classList.toggle("on", c);
  $("connTxt").textContent = Shim.failed() ? "이 브라우저는 연결을 지원하지 않음" : c ? "실시간 연결됨" : (Shim.role() ? "연결 중" : "대기 중");
  render();
});
room.onPeers(() => onRoom());
if (URL_ROOM){
  Shim.joinRoom(URL_ROOM);
  if (me.sid && me.nm && me.room === URL_ROOM && Date.now() - (me.at || 0) < 3*3600*1000) join({ preventDefault(){} });
}
else { const sv = store.get("tf-host"); if (sv && sv.v === V && store.get("tf-code") && Date.now() - (sv.savedAt || 0) < RESUME_MS) hostStartAsHost(true); }
render();
})();
