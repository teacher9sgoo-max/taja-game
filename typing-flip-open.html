<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타자 뒤집기 대전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
/* Layout: arcade cabinet. HUD bar (title, timer, sound) + team score strip on top, proverb-chance banner, 6x5 word-card board as the stage with
   event toasts/ink/missiles layered over it, roster + host controls beside it. Students get the board full width with a personal HUD and a big typing bar. */
:root{
  color-scheme:dark;
  --bg:#0a0c18; --surface:#151935; --surface2:#1d2246; --ink:#f1f3ff; --muted:#9aa2c8; --line:#2b3160; --grid:#ffffff0a;
  --gold:#ffc83d; --gold-deep:#6b4a00; --ok:#3ddc84; --warn:#ffab4a; --blot:#04050b;
  --t0:#e5484d; --t1:#3e7bfa; --t2:#22a75c; --t3:#d4930f; --t4:#8f5de0;
  --t5:#13a3a3; --t6:#d84f97; --t7:#a5713f; --t8:#5a5fd0; --t9:#6f7d96;
  --f-arcade:"Black Han Sans","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-card:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
.t0{--tc:var(--t0)} .t1{--tc:var(--t1)} .t2{--tc:var(--t2)} .t3{--tc:var(--t3)} .t4{--tc:var(--t4)}
.t5{--tc:var(--t5)} .t6{--tc:var(--t6)} .t7{--tc:var(--t7)} .t8{--tc:var(--t8)} .t9{--tc:var(--t9)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* HUD */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-arcade);font-weight:400;font-size:1.7rem;line-height:1.05;margin:0;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--t0),var(--gold),var(--t1));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--muted);font-size:.8rem}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.timer{font-family:var(--f-arcade);font-size:2.6rem;line-height:1;min-width:4ch;text-align:center;font-variant-numeric:tabular-nums;padding:6px 16px;border-radius:10px;background:var(--bg);border:2px solid var(--line)}
.timer.low{color:var(--bg);background:var(--t0);border-color:var(--t0);animation:pulse .5s ease-in-out infinite alternate}
.timer.fever{border-color:var(--gold);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 60%,transparent)}
.hudr{justify-self:end;display:flex;align-items:center;gap:10px}
.phase{color:var(--muted);font-size:.85rem}
.snd{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.8rem}
.snd[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
@keyframes pulse{to{transform:scale(1.06)}}

.scores{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--tc) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 55%,var(--surface))}
.chip .nm{font-family:var(--f-card);font-size:1.05rem;color:color-mix(in srgb,var(--tc) 55%,var(--ink))}
.chip .n{font-family:var(--f-arcade);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip .u{font-size:.75rem;color:var(--muted)}
.chip.lead{box-shadow:0 0 0 2px var(--tc),0 0 16px color-mix(in srgb,var(--tc) 55%,transparent)}
.chip.mine{outline:2px dashed var(--ink);outline-offset:2px}
.chip.hit{animation:shake .4s}

/* proverb chance */
.pv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);border:2px solid var(--gold);
  background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));position:relative;overflow:hidden}
.pv .tag{font-family:var(--f-arcade);font-size:.95rem;color:var(--bg);background:var(--gold);padding:3px 10px;border-radius:6px;white-space:nowrap}
.pv .txt{flex:1;min-width:0;font-family:var(--f-card);font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.2;color:var(--gold);text-wrap:balance}
.pv .sec{font-family:var(--f-arcade);font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--gold)}
.pv .meter{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);transition:width 1s linear}
.pv.typing{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 50%,transparent),0 0 24px color-mix(in srgb,var(--gold) 40%,transparent)}
.pv .done{color:var(--ok)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.boardwrap{position:relative;min-width:0}
.board{--cols:6;--mcols:5;--ch:clamp(54px,9vh,84px);--cf:clamp(1.05rem,2vw,1.65rem);display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:box-shadow .3s}
.board.fever{box-shadow:0 0 0 2px var(--gold),0 0 30px color-mix(in srgb,var(--gold) 35%,transparent)}
.card{position:relative;height:var(--ch);border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--tc,var(--line));border-bottom:5px solid color-mix(in srgb,var(--tc,var(--line)) 60%,#000);
  font-family:var(--f-card);font-size:var(--cf);color:#fff;text-shadow:0 2px 0 #0005;padding:0 6px;text-align:center;overflow-wrap:anywhere;
  transition:box-shadow .15s, transform .15s; user-select:none}
.card.n{--tc:var(--surface2);color:var(--muted);text-shadow:none}
.card.hint{box-shadow:0 0 0 4px var(--gold);transform:translateY(-3px)}
.board[data-n="42"]{--cols:7;--mcols:6;--ch:clamp(50px,7.6vh,74px);--cf:clamp(.95rem,1.75vw,1.45rem)}
.board[data-n="56"]{--cols:8;--mcols:7;--ch:clamp(46px,6.6vh,66px);--cf:clamp(.9rem,1.5vw,1.3rem)}
.card.flip{animation:flip .38s ease}
.card.gone{transform:scale(.15) rotate(-8deg);opacity:0;transition:transform .16s ease-in,opacity .16s ease-in;box-shadow:none}
.card.spawn{animation:spawn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes spawn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.card.mine::after{content:"";position:absolute;inset:-4px;border-radius:13px;border:3px solid var(--ok);animation:fade 1s forwards}
.card.boom::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--gold);animation:boom .6s ease-out forwards;pointer-events:none}
.badge{position:absolute;top:-7px;right:-5px;font-family:var(--f-arcade);font-size:.72rem;line-height:1;padding:4px 7px;border-radius:999px;text-shadow:none;
  background:var(--gold);color:var(--bg);box-shadow:0 2px 0 var(--gold-deep);animation:bob 1s ease-in-out infinite alternate}
.badge.i{background:var(--ink);color:var(--blot);box-shadow:0 2px 0 var(--muted)}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes fade{to{opacity:0}}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}

.float{position:absolute;pointer-events:none;font-family:var(--f-arcade);font-size:1.5rem;color:var(--gold);text-shadow:0 2px 0 #000;animation:up .9s ease-out forwards;z-index:6}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
#ink{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;pointer-events:none;opacity:0;z-index:7;touch-action:none}
#ink.on{pointer-events:auto;opacity:1;cursor:grab}
#ink.fade{opacity:0;transition:opacity 2.2s ease-in}
.feed{position:absolute;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8}
.toast{font-family:var(--f-arcade);font-size:clamp(1.2rem,3vw,2.1rem);line-height:1.15;padding:8px 18px;border-radius:12px;text-align:center;max-width:92%;
  background:color-mix(in srgb,var(--tc,var(--gold)) 85%,#000);color:#fff;border:2px solid #fff3;box-shadow:0 8px 24px #0008;animation:pop 2.4s ease forwards}
.toast.gold{--tc:var(--gold);color:var(--bg)}
@keyframes pop{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.missile{position:fixed;left:0;top:0;width:44px;height:18px;pointer-events:none;z-index:60}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;
  background:color-mix(in srgb,var(--bg) 78%,transparent);border-radius:14px;backdrop-filter:blur(2px)}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;text-align:center;max-width:600px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ov h2{font-family:var(--f-arcade);font-weight:400;font-size:2rem;line-height:1.15;margin:0;text-wrap:balance}
.ov p{margin:0;color:var(--muted)}
.ov .big{font-family:var(--f-arcade);font-size:7rem;line-height:1;color:var(--gold)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;text-align:left}
.rules div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem;color:var(--muted)}
.rules b{display:block;font-family:var(--f-card);font-weight:400;font-size:1.05rem;color:var(--ink)}
.rank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;line-height:0;align-self:center}
.qr img{display:block;width:100%;height:auto}
.ov .qr{width:min(240px,60vw)}
.invite{display:flex;gap:12px;align-items:center}
.invite .qr{width:112px;flex:none;padding:6px}
.invite .url{flex:1;min-width:0;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;user-select:all}
.code{font-family:var(--f-arcade);font-size:2.6rem;line-height:1.1;letter-spacing:.08em;color:var(--gold)}
.ovurl{font-family:var(--f-body);font-size:.95rem;color:var(--ink);overflow-wrap:anywhere;user-select:all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.mvp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:.9rem}
.mvp span{padding:3px 10px;border-radius:999px;background:var(--bg)}

/* side */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--f-arcade);font-weight:400;font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--ink);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.go{background:var(--ok);color:var(--bg);font-family:var(--f-arcade);font-weight:400;font-size:1.1rem}
.msg{font-size:.85rem;color:var(--muted);margin:0}
.msg.warn{color:var(--warn)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.team h4{margin:0 0 6px;font-family:var(--f-card);font-weight:400;font-size:1.05rem;display:flex;justify-content:space-between;color:color-mix(in srgb,var(--tc) 60%,var(--ink))}
.team h4 .c{font-family:var(--f-body);font-size:.75rem;color:var(--muted)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.team li{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.85rem;padding:4px 8px;border-radius:7px;
  background:color-mix(in srgb,var(--tc) 14%,var(--bg));border-left:3px solid var(--tc);min-width:0}
.team li .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li .s{font-variant-numeric:tabular-nums;font-weight:700}
.team li select{font-size:.75rem;padding:1px 2px;border:1px solid var(--line);border-radius:5px;background:var(--surface);max-width:5.2em}
.team li.off{opacity:.45}
.team li.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* student HUD */
.me{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r);
  background:color-mix(in srgb,var(--tc,var(--line)) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--tc,var(--line)) 60%,var(--surface))}
.me .who b{display:block;font-family:var(--f-arcade);font-weight:400;font-size:1.3rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{font-size:.85rem;color:var(--muted)}
.stat{text-align:center}
.stat .n{display:block;font-family:var(--f-arcade);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.stat.combo .n{color:var(--gold)}
.stat.combo.hot .n{animation:pulse .3s ease-in-out 2 alternate}

/* typing bar */
.typebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:center;z-index:20}
.typebar input{flex:1;min-width:0;font-family:var(--f-card);font-size:1.9rem;border:3px solid var(--tc,var(--line));border-radius:12px;padding:8px 16px;background:var(--bg)}
.typebar input:disabled{opacity:.55}
.typebar .fb{min-width:7.5em;font-family:var(--f-arcade);font-size:1rem;text-align:right}
.fb.ok{color:var(--ok)} .fb.no{color:var(--warn)} .fb.gold{color:var(--gold)}
.shake{animation:shake .25s}

.as-player .stage{grid-template-columns:1fr}
.as-player #pRoster{display:none}

@media (max-width:900px){.stage{grid-template-columns:1fr}}
@media (max-width:560px){
  .board{grid-template-columns:repeat(var(--mcols),minmax(0,1fr));gap:6px;padding:6px}
  .card{height:48px;font-size:.95rem;border-bottom-width:4px}
  .board[data-n="56"] .card{height:42px;font-size:.85rem}
  .bar{grid-template-columns:1fr auto}
  .hudr{display:none}
  .brand h1{font-size:1.25rem}
  .timer{font-size:1.9rem}
  .chip .n{font-size:1.3rem}
  .me{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
  .stat .n{font-size:1.5rem}
  .typebar input{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){
  .card.flip,.card.spawn,.shake,.card.mine::after,.card.boom::before,.badge,.timer.low,.toast,.float,.chip.hit{animation:none}
  .card{transition:none}
  .card.gone{transition:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <div class="brand">
      <h1>타자 뒤집기 대전</h1>
      <small class="conn"><span id="dot" class="dot"></span><span id="connTxt">연결 준비 중</span></small>
    </div>
    <div id="timer" class="timer">1:30</div>
    <div class="hudr">
      <span id="phase" class="phase">대기실</span>
      <button type="button" id="btnSnd" class="snd" aria-pressed="false">소리 끔</button>
    </div>
  </header>
  <div id="scores" class="scores" aria-label="팀 점수"></div>

  <main class="stage">
    <section class="boardwrap">
      <div id="pvBar" class="pv" hidden>
        <span class="tag">속담 찬스 +100</span>
        <span id="pvTxt" class="txt"></span>
        <span id="pvSec" class="sec"></span>
        <span id="pvMeter" class="meter"></span>
      </div>
      <div style="position:relative;margin-top:10px">
        <div id="board" class="board" aria-label="단어 카드판"></div>
        <canvas id="ink" aria-hidden="true"></canvas>
        <div id="feed" class="feed" aria-live="polite"></div>
        <div id="overlay" class="overlay"><div id="ovBox" class="ov"></div></div>
      </div>
    </section>

    <aside class="side">
      <form id="pJoin" class="panel" autocomplete="off">
        <h3>게임 참가</h3>
        <div class="row">
          <div class="field"><label for="inSid">학번</label><input id="inSid" inputmode="numeric" maxlength="10" placeholder="10305"></div>
          <div class="field"><label for="inName">이름</label><input id="inName" maxlength="10" placeholder="김민수"></div>
        </div>
        <div class="field" id="codeField"><label for="inCode">방 코드</label><input id="inCode" maxlength="6" placeholder="선생님이 알려 준 코드" autocapitalize="characters" style="text-transform:uppercase"></div>
        <button id="btnJoin" class="btn go" type="submit">참가하기</button>
        <p class="msg">팀은 입장하면 무작위로 배정됩니다.</p>
        <p id="joinMsg" class="msg">진행자 화면을 찾는 중입니다.</p>
        <button id="btnHost" class="btn ghost" type="button" hidden>새 게임방 만들기 (선생님)</button>
      </form>

      <section id="pPlayer" hidden>
        <div id="meBox" class="me">
          <div class="who"><b id="myName"></b><span id="myInfo"></span></div>
          <div class="stat"><span id="myScore" class="n">0</span><span class="l">내 점수</span></div>
          <div id="comboBox" class="stat combo"><span id="myCombo" class="n">0</span><span class="l">콤보</span></div>
        </div>
        <p id="pMsg" class="msg" style="margin-top:8px"></p>
        <button type="button" id="btnLeave" class="btn ghost" style="margin-top:8px">나가기</button>
      </section>

      <section id="pHost" class="panel" hidden>
        <h3>진행자</h3>
        <div class="row">
          <div class="field"><label for="selMax">최대 인원</label><select id="selMax"></select></div>
          <div class="field"><label for="selTeams">팀 수</label><select id="selTeams"></select></div>
        </div>
        <div class="row">
          <div class="field"><label for="selDur">제한 시간</label>
            <select id="selDur"><option value="60">60초</option><option value="90">90초</option><option value="120" selected>120초</option><option value="180">180초</option><option value="300">5분</option></select></div>
          <div class="field"><label for="selLang">단어</label>
            <select id="selLang"><option value="ko" selected>한글</option><option value="en">영어</option><option value="mix">한글+영어</option></select></div>
        </div>
        <div class="field"><label>학생 초대</label>
          <div class="invite"><div id="qrSmall" class="qr"></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1"><span id="inviteUrl" class="url"></span><button type="button" id="btnCopy" class="btn ghost">링크 복사</button></div></div>
        </div>
        <button type="button" id="btnShuffle" class="btn ghost">팀 무작위 재배치</button>
        <div class="row">

const Shim = (() => {
  let peer = null, role = "", code = "", hostConn = null, hostPres = null, myPres = {}, isConn = false, failed = false, fireT = 0, retryT = 0;
  const conns = new Map(), stu = new Map(), ph = [], ch = [];

  const send = (c, m) => { try { if (c && c.open) c.send(m); } catch(e){} };
  function peers(){
    const a = [{ peer:"me", by:null, isMe:true, sameTab:true, kind:"viewer", guest:false, presence:myPres, updatedAt:Date.now() }];
    if (role === "host") for (const [id, v] of stu) a.push({ peer:id, by:null, isMe:false, sameTab:false, kind:"viewer", guest:false, presence:v.p, updatedAt:v.t });
    if (role === "student" && hostPres) a.push({ peer:"host", by:null, isMe:false, sameTab:false, kind:"viewer", guest:false, presence:hostPres, updatedAt:Date.now() });
    return a;
  }
  function presence(patch){
    const n = { ...myPres }; for (const k in patch){ if (patch[k] === null) delete n[k]; else n[k] = patch[k]; } myPres = n;
    if (role === "host"){ const m = { h:myPres }; for (const c of conns.values()) send(c, m); }
    else if (role === "student") send(hostConn, { p:myPres });
    fire(); return Promise.resolve();
  }
  function reset(){ clearTimeout(retryT); try { if (peer) peer.destroy(); } catch(e){} peer = null; hostConn = null; hostPres = null; conns.clear(); stu.clear(); setConn(false); }
  function noLib(){ if (typeof Peer === "undefined"){ failed = true; setConn(false); ch.forEach(h => { try { h(false); } catch(e){} }); return true; } return false; }
  const keepAlive = p => p.on("disconnected", () => setTimeout(() => { try { if (p === peer && !p.destroyed) p.reconnect(); } catch(e){} }, 1500));
  function hostRoom(c){
    if (role === "host" && code === c && peer && !peer.destroyed) return;
    reset(); role = "host"; code = c;
    if (noLib()) return;
    const p = peer = new Peer(PID(c));
    p.on("open", () => setConn(true));
    p.on("connection", conn => {
      conn.on("open", () => { conns.set(conn.peer, conn); send(conn, { h:myPres }); });

    if (!peer || peer.destroyed || peer.disconnected){ retry(); return; }

    const to = setTimeout(() => { if (hostConn === c && !c.open){ try { c.close(); } catch(e){} hostConn = null; retry(); } }, 8000);
    c.on("open", () => { clearTimeout(to); setConn(true); send(c, { p:myPres }); });
    c.on("data", d => { if (d && d.h && typeof d.h === "object"){ hostPres = d.h; fire(); } });
    const lost = () => { clearTimeout(to); if (hostConn !== c) return; hostConn = null; hostPres = null; setConn(false); fire(); retry(); };
    c.on("close", lost); c.on("error", lost);

    if (role === "student" && code === c && peer && !peer.destroyed) return;

      else if (["network","server-error","socket-error","socket-closed","browser-incompatible"].includes(e.type)) setConn(false);
    });
  }
  function leave(){ reset(); role = ""; code = ""; myPres = {}; fire(); }
  return { presence, peers, hostRoom, joinRoom, leave,

function missileFly(fromTeam, idxs){
  const chip = document.querySelector(`#scores .chip[data-t="${fromTeam}"]`) || $("timer");
  const r0 = chip.getBoundingClientRect();
  const x0 = r0.left + r0.width/2, y0 = r0.top + r0.height/2;
  const col = getComputedStyle(document.documentElement).getPropertyValue("--t" + fromTeam).trim() || "#ffc83d";
  (idxs || []).forEach((i, n) => {
    const c = cards[i]; if (!c) return;
    const r1 = c.getBoundingClientRect(); const x1 = r1.left + r1.width/2, y1 = r1.top + r1.height/2;
    if (reduceMotion){ setTimeout(() => boomAt([i]), 200); return; }
    const m = document.createElement("div"); m.className = "missile";
    m.innerHTML = `<svg viewBox="0 0 44 18" width="44" height="18"><path d="M2 9 L10 3 L10 15 Z" fill="#ffc83d"/><rect x="9" y="5" width="24" height="8" rx="3" fill="${col}"/><path d="M33 4 L43 9 L33 14 Z" fill="#f1f3ff"/><path d="M12 5 L8 0 L16 5 Z M12 13 L8 18 L16 13 Z" fill="${col}"/></svg>`;
    document.body.appendChild(m);
    const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
    const mx = (x0 + x1)/2, my = Math.min(y0, y1) - 80;
    const a = m.animate([
      { transform:`translate(${x0-22}px,${y0-9}px) rotate(${ang-40}deg)` },
      { transform:`translate(${mx-22}px,${my-9}px) rotate(${ang}deg)`, offset:.5 },

    ], { duration:750, delay:n*140, easing:"ease-in", fill:"both" });
    a.onfinish = () => { m.remove(); boomAt([i]); };
  });
}

let inkCtx = null, wiping = false;
function inkSplash(){
  const cv = $("ink"); const r = cv.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); inkCtx = ctx;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--blot").trim() || "#04050b";
  for (let b=0; b<9; b++){
    const cx = Math.random()*r.width, cy = Math.random()*r.height, R = 40 + Math.random()*Math.min(110, r.width/6);
    ctx.globalAlpha = .93;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
    for (let s=0; s<10; s++){
      const a = Math.random()*Math.PI*2, d = R*(.8 + Math.random()*.9), rr = 4 + Math.random()*R*.28;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a)*d, cy + Math.sin(a)*d, rr, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillRect(cx - 5, cy, 10, R * (1 + Math.random()));
  }
  ctx.globalAlpha = 1;
  cv.classList.remove("fade"); cv.classList.add("on");
  clearTimeout(inkSplash.t1); clearTimeout(inkSplash.t2);
  inkSplash.t1 = setTimeout(() => cv.classList.add("fade"), 4000);
  inkSplash.t2 = setTimeout(() => cv.classList.remove("on","fade"), 6300);
}
function wipe(ev){
  if (!inkCtx || !$("ink").classList.contains("on")) return;
  const r = $("ink").getBoundingClientRect();
  inkCtx.globalCompositeOperation = "destination-out";
  inkCtx.beginPath(); inkCtx.arc(ev.clientX - r.left, ev.clientY - r.top, 34, 0, Math.PI*2); inkCtx.fill();
}
$("ink").addEventListener("pointerdown", e => { wiping = true; wipe(e); });
$("ink").addEventListener("pointermove", e => { if (wiping || e.pointerType === "mouse") wipe(e); });
addEventListener("pointerup", () => { wiping = false; });

function runEv(e){
  const [, type, t, sid, idxs, target] = e;
  const mine = myEntry();
  if (type === "ink"){
    toast(`${TN[+t] || ""} 팀 먹물 공격!`, t); SFX.ink();
    document.querySelectorAll("#scores .chip").forEach(c => { if (c.dataset.t !== t){ c.classList.remove("hit"); void c.offsetWidth; c.classList.add("hit"); } });
    if (mode === "player" && mine && mine.t !== t) inkSplash();
  } else if (type === "mis"){
    toast(`${TN[+t] || ""} 팀 미사일 발사 → ${TN[+target] || ""} 팀`, t); SFX.missile();
    missileFly(t, idxs);
  } else if (type === "pv"){

    setTimeout(() => boomAt(idxs), 150);
  } else if (type === "pvon"){

  } else if (type === "fv"){

function processEvents(){

    seenEk = e[0]; runEv(e);

// ---------- room helpers ----------
function findHost(){
  if (!room) return null;
  let best = null;
  for (const p of room.peers()){
    const pr = p.presence;
    if (pr && pr.role === "host" && pr.g && pr.g.v === V && !(p.isMe && p.sameTab && mode !== "host")){
      if (!best || (pr.since||0) < (best.presence.since||0)) best = p;
    }
  }
  return best;
}

function onRoom(){
  if (mode === "host"){ hostSync(); return; }
  const h = findHost();
  const g = h ? decode(h.presence.g) : null;
  if (g){
    if (G.ph !== "play" && g.ph === "play") combo = 0;
    if (G.ph === "ready" && g.ph === "ready" && g.left !== G.left) SFX.tick();
    G = g;

  render();
}

}

function pvTyping(v){
  const p = pvText(); if (!p || G.ph !== "play") return false;
  const a = norm(v); return a.length > 0 && norm(p).startsWith(a);
}

let pendingSubmit = false, fbTimer = 0;
function feedback(txt, cls){
  const fb = $("fb"); fb.textContent = txt; fb.className = "fb " + cls;
  clearTimeout(fbTimer); fbTimer = setTimeout(() => { fb.textContent = ""; }, 1400);
}
function claim(c){ myN++; myClaims = myClaims.concat([[c[0], c[1], myN]]).slice(-6); setPresence({ cl: myClaims }); }
function submitWord(){
  const inp = $("typeIn"); const w = inp.value.trim();
  if (!w || G.ph !== "play") return;
  const e = myEntry(); if (!e) return;
  const p = pvText();
  if (p && norm(w) === norm(p)){ claim([-1, w]); inp.value = ""; feedback("속담 도전!", "gold"); renderPv(); return; }
  const i = (G.words||[]).indexOf(w);
  if (i < 0){
    if (pvTyping(w)) { feedback("속담을 끝까지", "gold"); return; }
    feedback("없는 단어", "no"); SFX.miss(); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); return;
  }
  if (G.own[i] === e.t){ feedback("이미 우리 팀", "no"); inp.value = ""; renderBoard(); return; }
  claim([i, w]);
  inp.value = ""; feedback("뒤집기!", "ok"); renderBoard(); renderPv();
}

// ---------- host ----------
function hostPublish(){
  const g = encode(H);
  if (enc.encode(JSON.stringify(g)).length > 3700){ g.fx = g.fx.slice(-2); g.x = []; g.ev = g.ev.slice(-2); }
  setPresence({ role:"host", since:H.since, g });
  store.set("tf-host", H);
  G = H; render();
}

function drawWord(exclude){
  for (let tries=0; tries<400; tries++){
    if (!bag.length) bag = shuffle(pool(H.lang));
    const w = bag.pop();
    if (!exclude.includes(w)) return w;
  }
  return pick(pool(H.lang));
}
function pushEv(type, t = "", sid = "", idxs = [], target = ""){
  H.ek++; H.ev = H.ev.concat([[H.ek, type, t, sid, idxs, target]]).slice(-5);
}
function setOwn(i, t){ H.own = H.own.slice(0,i) + t + H.own.slice(i+1); }
function setIt(i, c){ H.it = H.it.slice(0,i) + c + H.it.slice(i+1); }
function replaceCard(i){ H.words[i] = drawWord(H.words); setIt(i, "."); }
function stealCards(fromTeams, toTeam, n){
  const idx = shuffle([...H.own].map((c, i) => fromTeams.includes(c) ? i : -1).filter(i => i >= 0)).slice(0, n);
  for (const i of idx){ setOwn(i, toTeam); replaceCard(i); }
  return idx;
}

function teamsForJoin(){ return (H.ph === "play" || H.ph === "ready") && H.act ? H.act.split("") : teamIds(H.nt); }
function pickTeam(){
  const ts = teamsForJoin();
  const c = ts.map(t => H.ro.filter(e => e.t === t).length);
  const min = Math.min(...c);
  return pick(ts.filter((t, i) => c[i] === min));
}
function reshuffle(){
  const ts = shuffle(teamIds(H.nt));
  shuffle(H.ro).forEach((e, i) => { e.t = ts[i % ts.length]; });
}

function hostStartAsHost(){
  if (URL_ROOM) return;
  ROOM = store.get("tf-code") || newCode(); store.set("tf-code", ROOM);
  qrData = ""; $("qrSmall").textContent = "";
  Shim.hostRoom(ROOM);
  ensureAudio();
  const saved = store.get("tf-host");
  const now = Date.now();
  if (saved && saved.v === V && saved.ph === "play" && saved.endAt > now){ H = saved; }
  else H = { v:V, ph:"lobby", dur:Number($("selDur").value), lang:$("selLang").value, nt:Number($("selTeams").value), mx:Number($("selMax").value),
             act:"", n:30, left:0, words:[], own:"", it:"", ro:[], x:[], fx:[], ev:[], ek:0, bp:[], pv:null, fv:false, used:[], k:0 };
  H.since = now; H.n = H.n || 30;
  H.ro.forEach(e => { e.on = 0; });
  lastN = new Map(); bag = []; seenEk = -1;
  mode = "host"; prevOwn = "";
  $("selDur").value = String(H.dur); $("selLang").value = H.lang; $("selTeams").value = String(H.nt); $("selMax").value = String(H.mx);
  hostSync(true);
}

function hostSync(force){
  if (mode !== "host" || !H) return;
  let changed = !!force;
  const now = Date.now();
  const present = new Map();
  for (const pe of room.peers()){
    const p = pe.presence;
    if (!p || p.role !== "p" || !okSid(p.sid)) continue;
    const prev = present.get(p.sid);
    if (!prev || pe.updatedAt > prev.updatedAt) present.set(p.sid, pe);
  }
  const safeName = s => { const n = clean(s, 10); return n && !isBad(n) ? n : "이름 없음"; };
  for (const e of H.ro){
    const pe = present.get(e.id); const on = pe ? 1 : 0;
    if (e.on !== on){ e.on = on; changed = true; }
    if (pe){ const nm = safeName(pe.presence.nm); if (nm !== e.n){ e.n = nm; changed = true; } }
  }
  if (H.ph === "lobby"){
    const before = H.ro.length; H.ro = H.ro.filter(e => e.on);
    if (H.ro.length !== before) changed = true;
  }
  if ((H.ph === "lobby" || H.ph === "end") && H.ro.length > H.mx){ H.ro = H.ro.slice(0, H.mx); changed = true; }

  const x = [];
  for (const [sid, pe] of present){
    if (H.ro.some(e => e.id === sid)) continue;
    if (H.ro.length >= H.mx){ x.push(sid); continue; }
    H.ro.push({ id:sid, n:safeName(pe.presence.nm), t:pickTeam(), s:0, on:1 });
    changed = true;
  }
  if (JSON.stringify(x) !== JSON.stringify(H.x)){ H.x = x; changed = true; }
  if (H.ph === "lobby"){ const n = sizeFor(H.ro.length); if (n !== H.n){ H.n = n; changed = true; } }

  for (const [sid, pe] of present){
    const cl = Array.isArray(pe.presence.cl) ? pe.presence.cl.slice().sort((a,b)=>(a?.[2]||0)-(b?.[2]||0)) : [];
    let last = lastN.get(pe.peer) || 0;
    for (const c of cl){
      if (!Array.isArray(c)) continue;
      const [i, w, n] = c;
      if (typeof n !== "number" || n <= last) continue;
      last = n;
      if (H.ph !== "play") continue;
      const e = H.ro.find(r => r.id === sid);
      if (!e || typeof w !== "string") continue;
      const mult = H.fv ? 2 : 1;
      const others = H.act.split("").filter(t => t !== e.t);
      if (i === -1){
        if (!H.pv || now > H.pv.end || norm(w) !== norm(PV[H.pv.i])) continue;
        const idxs = stealCards(others, e.t, 3);
        const pts = 100 * mult;
        H.bp[+e.t] = (H.bp[+e.t] || 0) + pts; e.s += pts;
        H.pv = null; H.nextPv = now + 18000;
        pushEv("pv", e.t, sid, idxs);
        changed = true; continue;
      }
      if (!Number.isInteger(i) || i < 0 || i >= H.n) continue;
      if (H.words[i] !== w || H.own[i] === e.t) continue;
      const item = H.it[i];
      setOwn(i, e.t); replaceCard(i);
      const pts = 10 * mult; e.s += pts; H.k++;
      H.fx = H.fx.concat([[i, e.t, sid, H.k, pts]]).slice(-6);
      if (item === "i") pushEv("ink", e.t, sid);
      if (item === "m" && others.length){
        const sc = others.map(t => count(H.own, t));
        const top = Math.max(...sc);
        const target = pick(others.filter((t, k) => sc[k] === top));
        const idxs = stealCards([target], e.t, 3);
        e.s += idxs.length * 10 * mult;
        pushEv("mis", e.t, sid, idxs, target);
      }
      changed = true;
    }
    lastN.set(pe.peer, last);
  }
  if (changed) hostPublish(); else { G = H; }
}

function hostMove(sid, t){
  const e = H.ro.find(r => r.id === sid); if (!e || !okT(t) || +t >= H.nt) return;
  e.t = t; hostPublish();
}

function pickPv(){
  const [a, b] = pvRange(H.lang);
  const all = Array.from({length:b-a}, (_, k) => a + k);
  let cand = all.filter(i => !H.used.includes(i));
  if (!cand.length){ H.used = []; cand = all; }
  const i = pick(cand); H.used.push(i); return i;
}
function placeItem(){
  const free = []; for (let i=0;i<H.n;i++) if (H.it[i] === ".") free.push(i);
  if (!free.length) return;
  setIt(pick(free), Math.random() < .5 ? "m" : "i");
}
const itemCount = () => [...H.it].filter(c => c !== ".").length;

function hostStart(){
  if (!H.ro.length){ $("hMsg").textContent = "참가자가 한 명 이상 입장해야 시작할 수 있습니다."; return; }
  H.dur = Number($("selDur").value); H.lang = $("selLang").value;
  let act = teamIds(H.nt).filter(t => H.ro.some(e => e.t === t));
  for (const t of teamIds(H.nt)){ if (act.length >= 2) break; if (!act.includes(t)) act.push(t); }
  act.sort();
  H.act = act.join("");
  bag = shuffle(pool(H.lang));
  H.n = sizeFor(H.ro.length);
  H.words = []; for (let i=0;i<H.n;i++) H.words.push(drawWord(H.words));
  const order = shuffle(act);
  H.own = shuffle(Array.from({length:H.n}, (_, i) => order[i % order.length])).join("");
  H.it = ".".repeat(H.n); for (let k=0;k<Math.round(H.n/15);k++) placeItem();
  H.bp = Array(H.nt).fill(0);
  H.ro.forEach(e => { e.s = 0; });
  H.fx = []; H.k = 0; H.pv = null; H.fv = false; H.used = H.used || [];
  H.ph = "ready"; H.left = 3; H.readyAt = Date.now() + 3000;
  lastN = new Map(room.peers().map(p => [p.peer, Math.max(0, ...((p.presence?.cl)||[]).map(c => (Array.isArray(c) && c[2]) || 0))]));
  const empty = H.nt - teamIds(H.nt).filter(t => H.ro.some(e => e.t === t)).length;
  $("hMsg").textContent = empty > 0 ? `참가자가 없는 ${empty}개 팀은 빼고 시작합니다.` : "게임이 시작됩니다.";
  hostPublish();
}

function hostLobby(){
  H.ph = "lobby"; H.words = []; H.own = ""; H.it = ""; H.fx = []; H.k = 0; H.left = 0; H.act = ""; H.pv = null; H.fv = false;
  H.ro.forEach(e => { e.s = 0; });
  $("hMsg").textContent = "참가자 옆 목록에서 팀을 바꿀 수 있습니다.";
  hostSync(true);
}

function hostTick(){
  if (mode !== "host" || !H) return;
  const now = Date.now();
  if (H.ph === "ready"){
    const l = Math.ceil((H.readyAt - now)/1000);
    if (l <= 0){
      H.ph = "play"; H.endAt = now + H.dur*1000; H.left = H.dur;
      H.nextIt = now + 6000; H.nextPv = now + Math.min(15000, H.dur*1000/4);
      hostPublish();
    } else if (l !== H.left){ H.left = l; SFX.tick(); hostPublish(); }
  } else if (H.ph === "play"){
    const l = Math.max(0, Math.ceil((H.endAt - now)/1000));
    if (l <= 0){ H.ph = "end"; H.left = 0; H.pv = null; H.fv = false; pushEv("end"); hostPublish(); return; }
    let ch = l !== H.left; H.left = l;
    const fv = l <= 10;
    if (fv !== H.fv){ H.fv = fv; if (fv) pushEv("fv"); ch = true; }
    if (now >= H.nextIt){ H.nextIt = now + 5000 + Math.random()*4000; if (itemCount() < Math.round(H.n/10)){ placeItem(); ch = true; } }
    if (H.pv && now >= H.pv.end){ H.pv = null; H.nextPv = now + 12000; ch = true; }
    if (!H.pv && now >= H.nextPv && l > 14){ H.pv = { i:pickPv(), end: now + 15000 }; pushEv("pvon"); ch = true; }
    if (ch) hostPublish();
  }
}

function hostOff(){
  setPresence({ role:null, since:null, g:null });
  store.del("tf-host");
  Shim.leave();
  mode = "join"; H = null; G = demoState(); prevOwn = ""; seenEk = -1; onRoom();
}

// ---------- wiring ----------
$("inSid").value = me.sid || ""; $("inName").value = me.nm || "";
$("pJoin").addEventListener("submit", join);
$("btnLeave").onclick = leave;
$("btnHost").onclick = hostStartAsHost;
$("btnStart").onclick = hostStart;
$("btnLobby").onclick = hostLobby;
$("btnHostOff").onclick = hostOff;
$("btnCopy").onclick = () => {
  const done = () => { $("btnCopy").textContent = "복사됨"; setTimeout(() => { $("btnCopy").textContent = "링크 복사"; }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("inviteUrl")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("btnCopy").textContent = "Ctrl+C로 복사하세요"; };
  try { navigator.clipboard.writeText(inviteUrl()).then(done, fallback); } catch(e){ fallback(); }
};
$("btnSnd").onclick = () => { soundOn = !soundOn; store.set("tf-snd", soundOn); if (soundOn) ensureAudio(); renderSnd(); };
$("btnShuffle").onclick = () => { if (!H) return; reshuffle(); $("hMsg").textContent = "팀을 무작위로 다시 나눴습니다."; hostPublish(); };
$("selTeams").onchange = () => {
  if (!H) return; H.nt = Number($("selTeams").value); reshuffle();
  $("hMsg").textContent = `${H.nt}팀으로 무작위 배정했습니다.`; hostPublish();
};
$("selMax").onchange = () => {
  if (!H) return; H.mx = Number($("selMax").value);
  $("hMsg").textContent = `최대 인원을 ${H.mx}명으로 바꿨습니다.`; hostSync(true);
};
$("selDur").onchange = () => { if (!H) return; H.dur = Number($("selDur").value); hostPublish(); };
$("selLang").onchange = () => { if (!H) return; H.lang = $("selLang").value; hostPublish(); };

const ti = $("typeIn");
const isWord = v => (G.words || []).includes(v.trim());
ti.addEventListener("keydown", e => {
  ensureAudio();
  if (e.key === "Enter"){
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229){ pendingSubmit = true; return; }
    submitWord(); return;
  }
  if (e.key === " " || e.code === "Space"){
    if (pvTyping(ti.value) && !isWord(ti.value)) return;   // 속담은 띄어쓰기 허용
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229){ pendingSubmit = true; return; }
    submitWord();
  }
});
ti.addEventListener("compositionend", () => { if (pendingSubmit){ pendingSubmit = false; setTimeout(submitWord, 0); } });
ti.addEventListener("input", () => {
  if (/\s$/.test(ti.value) && !(pvTyping(ti.value) && !isWord(ti.value))){ ti.value = ti.value.trim(); submitWord(); }
  else { renderBoard(); renderPv(); }
});

setInterval(hostTick, 200);
setInterval(() => { if (mode === "player" && combo && Date.now() - lastHitAt > 3500){ combo = 0; $("myCombo").textContent = 0; } }, 500);
renderSnd();
render();

room = Shim;
room.onConnection(c => {
  connected = c;
  $("dot").classList.toggle("on", c);
  $("connTxt").textContent = Shim.failed() ? "연결 프로그램을 불러오지 못함" : c ? "실시간 연결됨" : (Shim.role() ? "연결 중" : "대기 중");
  render();
});
room.onPeers(() => onRoom());
if (URL_ROOM) Shim.joinRoom(URL_ROOM);
else { const sv = store.get("tf-host"); if (sv && sv.v === V && sv.ph === "play" && sv.endAt > Date.now()) hostStartAsHost(); }
render();
})();
</script>
